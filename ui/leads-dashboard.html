<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leads Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #12233d;
      margin: 0;
      padding: 24px 16px;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: #fff;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(15, 44, 86, 0.08);
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 34px;
      color: #0f2c56;
    }

    .header p {
      margin: 0;
      color: #5a6a85;
      font-size: 16px;
    }

    .lead-card {
      background: #fff;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(15, 44, 86, 0.08);
      border: 1px solid rgba(91, 123, 178, 0.10);
    }

    .lead-top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .lead-name {
      font-size: 24px;
      font-weight: 700;
      color: #0f2c56;
      margin: 0 0 4px;
    }

    .lead-meta {
      color: #5a6a85;
      font-size: 14px;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-right: 8px;
    }

    .priority-high {
      background: #fee2e2;
      color: #b91c1c;
    }

    .priority-medium {
      background: #fef3c7;
      color: #b45309;
    }

    .priority-low {
      background: #dcfce7;
      color: #15803d;
    }

    .status-badge {
      background: #e0ecff;
      color: #1d4ed8;
    }

    .summary {
      margin: 14px 0;
      padding: 14px 16px;
      border-radius: 14px;
      background: #f9fbfe;
      border: 1px solid #dbe4f0;
      line-height: 1.8;
    }

    .controls {
      display: grid;
      grid-template-columns: 180px 1fr 140px;
      gap: 12px;
      align-items: start;
      margin-top: 14px;
    }

    select,
    textarea,
    button {
      font: inherit;
    }

    select,
    textarea {
      width: 100%;
      border: 1px solid #cfd9e8;
      border-radius: 12px;
      padding: 12px;
      box-sizing: border-box;
      background: #fff;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      background: #0f2c56;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #173c73;
    }

    .empty {
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      text-align: center;
      color: #5a6a85;
    }

    .save-msg {
      margin-top: 10px;
      font-size: 14px;
      color: #15803d;
      font-weight: 700;
    }

    @media (max-width: 900px) {
      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="header">
      <h1>Leads Dashboard</h1>
      <p>Track new leads, update statuses, and keep notes on your follow-up activity.</p>
    </div>

    <div id="leadStats" style="
  display:grid;
  grid-template-columns:repeat(5, minmax(0, 1fr));
  gap:14px;
  margin-bottom:20px;
">
      <div class="summary"><strong>Total Leads</strong><br><span id="statTotal">0</span></div>
      <div class="summary"><strong>New</strong><br><span id="statNew">0</span></div>
      <div class="summary"><strong>Contacted</strong><br><span id="statContacted">0</span></div>
      <div class="summary"><strong>Booked</strong><br><span id="statBooked">0</span></div>
      <div class="summary"><strong>Closed</strong><br><span id="statClosed">0</span></div>
      <div class="summary">
        <strong>Converted</strong><br>
        <span id="statConverted">0</span>
      </div>
      <div class="summary"><strong>Today</strong><br><span id="statToday">0</span></div>
      <div class="summary"><strong>This Week</strong><br><span id="statWeek">0</span></div>
      <div class="summary"><strong>This Month</strong><br><span id="statMonth">0</span></div>
      <div class="summary"><strong>This Year</strong><br><span id="statYear">0</span></div>
    </div>
    <div style="margin-bottom:20px;display:flex;gap:12px;flex-wrap:wrap;">
      <button onclick="window.print()" style="background:#0f2c56;">
        Print Visible Leads
      </button>
    </div>

    <div <div
      style="background:#fff;border-radius:18px;padding:16px;margin-bottom:20px;box-shadow:0 10px 30px rgba(15,44,86,0.08);display:flex;gap:14px;flex-wrap:wrap;align-items:center;">
      <div>
        <strong>Filter Leads:</strong>
        <select id="leadFilter" onchange="loadLeads()" style="max-width:260px;margin-left:12px;">
          <option value="All">All Leads</option>
          <option value="New">New</option>
          <option value="Contacted">Contacted</option>
          <option value="Booked">Booked</option>
          <option value="Follow-up Needed">Follow-up Needed</option>
          <option value="Converted - Tax Client">Converted - Tax Client</option>
          <option value="Closed">All Closed Leads</option>
        </select>
      </div>

      <div>
        <strong>Tax Year:</strong>
        <select id="taxYearFilter" onchange="loadLeads()" style="max-width:180px;margin-left:12px;">
          <option value="All">All Years</option>
          <option value="2024">2024</option>
          <option value="2025">2025</option>
          <option value="2026">2026</option>
          <option value="2027">2027</option>
          <option value="2028">2028</option>
          <option value="2029">2029</option>
          <option value="2030">2030</option>
        </select>
      </div>
    </div>

    <script>
      function esc(str) {
        return String(str || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function priorityClass(priority) {
        if (priority === "high") return "priority-high";
        if (priority === "medium") return "priority-medium";
        return "priority-low";
      }

      async function loadLeads() {
        const container = document.getElementById("leadsContainer");

        try {
          const res = await fetch("/api/leads");
          const data = await res.json();

          if (!res.ok || !data.ok) {
            throw new Error("Could not load leads.");
          }

          const leads = data.leads || [];
          const selectedFilter = document.getElementById("leadFilter")?.value || "All";
          const selectedTaxYear = document.getElementById("taxYearFilter")?.value || "All";

          const visibleLeads = leads.filter((lead) => {
            const status = lead.status || "New";
            const taxYear = String(
              lead?.taxData?.taxYear ||
              lead?.estimateSummary?.taxYear ||
              lead?.estimateSummary?.meta?.taxYear ||
              ""
            );

            const statusMatches =
              selectedFilter === "All"
                ? true
                : selectedFilter === "Closed"
                  ? status.startsWith("Closed -")
                  : status === selectedFilter;

            const yearMatches =
              selectedTaxYear === "All"
                ? true
                : taxYear === selectedTaxYear;

            return statusMatches && yearMatches;
          });
          const statsLeads = visibleLeads;

          document.getElementById("statTotal").textContent = statsLeads.length;
          document.getElementById("statNew").textContent = statsLeads.filter(l => (l.status || "New") === "New").length;
          document.getElementById("statContacted").textContent = statsLeads.filter(l => (l.status || "") === "Contacted").length;
          document.getElementById("statBooked").textContent = statsLeads.filter(l => (l.status || "") === "Booked").length;
          document.getElementById("statClosed").textContent =
            statsLeads.filter(l =>
              (l.status || "").startsWith("Closed -")
            ).length;
          document.getElementById("statConverted").textContent =
            statsLeads.filter(l =>
              (l.status || "") === "Converted - Tax Client"
            ).length;

          const now = new Date();

          const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());

          const startOfWeek = new Date(startOfToday);
          startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());

          const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
          const startOfYear = new Date(now.getFullYear(), 0, 1);

          const leadDate = (lead) => new Date(lead.timestamp || 0);

          document.getElementById("statToday").textContent = statsLeads.filter(l => leadDate(l) >= startOfToday).length;
          document.getElementById("statWeek").textContent = statsLeads.filter(l => leadDate(l) >= startOfWeek).length;
          document.getElementById("statMonth").textContent = statsLeads.filter(l => leadDate(l) >= startOfMonth).length;
          document.getElementById("statYear").textContent = statsLeads.filter(l => leadDate(l) >= startOfYear).length;
          if (!visibleLeads.length) {
            container.innerHTML = `<div class="empty">No leads found yet.</div>`;
            return;
          }

          container.innerHTML = visibleLeads
            .slice()
            .reverse()
            .map((lead) => {
              const summary = lead.estimateSummary || {};
              const total = summary.totalLine || "No summary available";
              const federal = summary.federalLine || "";
              const state = summary.stateLine || "";
              const notes = lead.notes || "";
              const status = lead.status || "New";
              const summaryUrl = `${window.location.origin}/estimate/${encodeURIComponent(lead.leadId)}`;

              const combinedNet = Number(summary?.combined?.net ?? summary?.combinedNet ?? 0);

              const nextActionTitle =
                combinedNet < 0
                  ? "Balance Due Lead — Schedule Review"
                  : combinedNet > 0
                    ? "Refund Lead — Follow Up to File"
                    : "Review Needed — Confirm Details";

              const nextActionText =
                combinedNet < 0
                  ? "This lead may owe. Best next step: schedule a 15-minute review to discuss why they may owe and what options may be available."
                  : combinedNet > 0
                    ? "This lead has a possible refund. Best next step: follow up and see if they want help completing the return."
                    : "This lead is close to break-even or missing summary details. Best next step: review the estimate and confirm the client’s information.";

              const nextActionStyle =
                combinedNet < 0
                  ? "background:#fff7ed;border:2px solid #f97316;color:#7c2d12;"
                  : combinedNet > 0
                    ? "background:#ecfdf5;border:2px solid #059669;color:#064e3b;"
                    : "background:#eef2ff;border:2px solid #4f46e5;color:#312e81;";

              return `
              <div class="lead-card" id="card-${esc(lead.leadId)}">
                <div class="lead-top">
                  <div>
                    <div class="lead-name">${esc(lead.contact?.name || "Unknown Lead")}</div>
                    <div class="lead-meta">
                      ${esc(lead.contact?.email || "")}<br>
                      ${esc(lead.contact?.phone || "No phone")}<br>
                      Lead ID: ${esc(lead.leadId)}<br>
                      Submitted: ${esc(lead.timestamp)}
                    </div>
                  </div>

                  <div>
                    <span class="badge ${priorityClass(lead.priority)}">${esc(lead.priority || "low")}</span>
                    <span class="badge status-badge">${esc(status)}</span>
                  </div>
                </div>

                <div class="summary">
  <strong>Estimate Summary</strong><br>
  ${esc(total)}<br>
  ${esc(federal)}<br>
  ${esc(state)}

  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;">
    <a
      href="${esc(summaryUrl)}"
      target="_blank"
      rel="noopener noreferrer"
      style="display:inline-block;background:#0f2c56;color:#fff;text-decoration:none;border-radius:10px;padding:10px 14px;font-weight:700;"
    >
      Open Estimate Summary
    </a>

    <button
      type="button"
      onclick="copySummaryLink('${esc(summaryUrl)}', 'copy-${esc(lead.leadId)}')"
      style="background:#ffffff;color:#0f2c56;border:1px solid #0f2c56;border-radius:10px;padding:10px 14px;font-weight:700;"
    >
      Copy Summary Link
    </button>

    <span id="copy-${esc(lead.leadId)}" style="font-weight:700;color:#15803d;align-self:center;"></span>
  </div>
  </div>
                  <div style="${nextActionStyle}border-radius:14px;padding:14px 16px;margin:14px 0;line-height:1.6;">
                  <strong>${esc(nextActionTitle)}</strong><br>
                  ${esc(nextActionText)}
                </div>

                <div class="controls">
                  <select id="status-${esc(lead.leadId)}">
                    ${[
                  "New",
                  "Contacted",
                  "Booked",
                  "Follow-up Needed",
                  "Converted - Tax Client",
                  "Closed - Not Interested",
                  "Closed - Bad Lead",
                  "Closed - Future Follow-Up"
                ]
                  .map(option => `<option value="${option}" ${option === status ? "selected" : ""}>${option}</option>`)
                  .join("")}
                  </select>

                  <textarea id="notes-${esc(lead.leadId)}" placeholder="Add notes about calls, emails, bookings, follow-up, etc.">${esc(notes)}</textarea>

                  <div>
                    <button onclick="saveLead('${esc(lead.leadId)}')">Save</button>


<div class="save-msg" id="msg-${esc(lead.leadId)}"></div>
                  </div>
                </div>
              </div>
            `;
            })
            .join("");
        } catch (err) {
          container.innerHTML = `<div class="empty">${esc(err.message || "Error loading leads.")}</div>`;
        }
      }

      async function copySummaryLink(url, msgId) {
        const msgEl = document.getElementById(msgId);

        try {
          await navigator.clipboard.writeText(url);
          if (msgEl) {
            msgEl.textContent = "Link copied";
            setTimeout(() => {
              msgEl.textContent = "";
            }, 2500);
          }
        } catch (err) {
          if (msgEl) {
            msgEl.textContent = "Copy failed";
            setTimeout(() => {
              msgEl.textContent = "";
            }, 2500);
          }
        }
      }

      async function saveLead(leadId) {
        const statusEl = document.getElementById(`status-${leadId}`);
        const notesEl = document.getElementById(`notes-${leadId}`);
        const msgEl = document.getElementById(`msg-${leadId}`);

        msgEl.textContent = "Saving...";

        try {
          const res = await fetch(`/api/leads/${encodeURIComponent(leadId)}`, {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              status: statusEl.value,
              notes: notesEl.value
            })
          });

          const data = await res.json();

          if (!res.ok || !data.ok) {
            throw new Error(data?.error || "Could not save lead.");
          }

          msgEl.textContent = "Saved";
        } catch (err) {
          msgEl.textContent = "Error saving";
        }
      }

      loadLeads();
    </script>
</body>

</html>
