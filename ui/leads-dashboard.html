<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tax Lead Center</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      color: #12233d;
    }

    .sidebar {
      width: 260px;
      min-height: 100vh;
      background: #0f2c56;
      color: white;
      padding: 20px 16px;
      box-sizing: border-box;
    }

    .sidebar h2 {
      margin: 0 0 20px;
    }

    .sidebar-btn {
      display: block;
      width: 100%;
      margin: 0 0 10px;
      padding: 11px;
      background: #28588c;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      text-align: left;
      font-weight: 700;
    }

    .sidebar-btn.active {
      background: white;
      color: #0f2c56;
      border-left: 7px solid #f59e0b;
    }

    .main {
      flex: 1;
      padding: 24px;
      box-sizing: border-box;
    }

    #leadCount {
      margin-bottom: 18px;
      font-weight: 700;
      color: #52637a;
    }

    .lead-card {
      background: white;
      border: 1px solid #dbe4f0;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .lead-name {
      font-size: 18px;
      font-weight: 900;
      color: #0f2c56;
      margin-bottom: 4px;
    }

    .lead-details {
      font-size: 14px;
      line-height: 1.5;
      color: #475569;
    }

    .empty,
    .error {
      background: white;
      border-radius: 10px;
      padding: 18px;
    }

    .error {
      border: 1px solid #ef4444;
      color: #b91c1c;
    }
  </style>
</head>

<body>
  <aside class="sidebar">
    <h2>Tax Lead Center</h2>

    <button class="sidebar-btn active" data-view="office">Office Work Queue</button>
    <button class="sidebar-btn" data-view="all">All Leads</button>
    <button class="sidebar-btn" data-view="written">Written Review Requests</button>
    <button class="sidebar-btn" data-view="closed">Closed Leads</button>
    <button class="sidebar-btn" onclick="window.location.href='/transcript-requests'">New Transcript Requests</button>
  </aside>

  <main class="main">
    <h1 id="viewTitle">Office Work Queue</h1>
    <div id="leadCount"> </div>
    <div id="leadList"></div>
  </main>

  
<div id="detailPanel" style="
  position: fixed;
  right: 0;
  top: 0;
  width: 360px;
  height: 100vh;
  background: #ffffff;
  border-left: 1px solid #dbe4f0;
  box-shadow: -10px 0 30px rgba(0,0,0,0.08);
  padding: 16px;
  overflow-y: auto;
  display: none;
  z-index: 9999;
">
  <h2 id="dpName">Lead Details</h2>
  <div id="dpEmail"></div>
  <div id="dpStatus"></div>
  <div id="dpTaxYear"></div>
  <div id="dpRefund"></div>
</div>



<script>
let allLeads = [];
let currentView = "office";

function getVisibleLeads(){
  if(currentView==="written"){
    return allLeads.filter(l => (l.status||"").toLowerCase().includes("written review"));
  }

  if(currentView==="closed"){
    return allLeads.filter(l => {
      const s=(l.status||"").toLowerCase();
      return s.includes("closed")||s.includes("completed");
    });
  }

  if(currentView==="office"){
    return allLeads.filter(l => {
      const s=(l.status||"").toLowerCase();
      return !s.includes("closed") && !s.includes("completed");
    });
  }

  return allLeads;
}

function openPanel(lead){
  const panel=document.getElementById("detailPanel");
  panel.style.display="block";

  document.getElementById("dpName").innerText = lead.contact?.name || "No Name";
  document.getElementById("dpEmail").innerText = lead.contact?.email || "No Email";
  document.getElementById("dpStatus").innerText = "Status: " + (lead.status||"New");
  document.getElementById("dpTaxYear").innerText = "Tax Year: " + (lead.taxData?.taxYear || "");
  document.getElementById("dpRefund").innerText =
    "Refund: $" + (lead.estimateSummary?.combined?.refundAmount || 0);
}

function renderLeads(){
  const list=document.getElementById("leadList");
  const visible=getVisibleLeads();

  if(!visible.length){
    list.innerHTML="<div>No leads found</div>";
    return;
  }

  list.innerHTML = visible.map((l)=>`
    <div class="lead-card" onclick='openPanel(${JSON.stringify(l)})'>
      <b>${l.contact?.name||"No Name"}</b><br/>
      ${l.contact?.email||""}<br/>
      Status: ${l.status||"New"}
    </div>
  `).join("");
}

async function loadLeads(){
  try{
    const res=await fetch("/api/leads");
    const data=await res.json();

    allLeads = data.leads || [];
    renderLeads();

  }catch(e){
    console.log(e);
  }
}

window.addEventListener("DOMContentLoaded", loadLeads);
</script>
<script>
document.addEventListener("DOMContentLoaded", () => {

  const buttons = document.querySelectorAll(".sidebar-btn[data-view]");

  buttons.forEach(btn => {
    btn.addEventListener("click", () => {

      buttons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      currentView = btn.dataset.view;

      const titles = {
        office: "Office Work Queue",
        all: "All Leads",
        written: "Written Review Requests",
        closed: "Closed Leads"
      };

      document.getElementById("viewTitle").innerText =
        titles[currentView] || "Leads";

      renderLeads();
    });
  });

});
</script>
<script>
function clearDetailPanel(){
  const panel = document.getElementById("detailPanel");
  if(panel){
    panel.style.display = "none";
  }

  const fields = ["dpName","dpEmail","dpStatus","dpTaxYear","dpRefund"];
  fields.forEach(id => {
    const el = document.getElementById(id);
    if(el) el.innerText = "";
  });
}
</script>
<script>
document.addEventListener("DOMContentLoaded", () => {

  document.querySelectorAll(".sidebar-btn[data-view]").forEach(btn => {
    btn.addEventListener("click", () => {

      // RESET RIGHT PANEL ON VIEW CHANGE
      if(typeof clearDetailPanel === "function"){
        clearDetailPanel();
      }

    });
  });

});
</script>
<script>
function getActiveLeadId(lead){
  return (
    lead?.leadId ||
    lead?.id ||
    lead?.estimateId ||
    lead?.lead_id ||
    lead?.estimate?.leadId ||
    ""
  );
}

async function saveActiveLeadChanges(changes){
  if(!window.activeLead){
    alert("Select a lead first.");
    return null;
  }

  const leadId = getActiveLeadId(window.activeLead);

  if(!leadId){
    alert("This lead does not have a usable Lead ID.");
    return null;
  }

  const response = await fetch(
    "/api/leads/" + encodeURIComponent(leadId),
    {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(changes)
    }
  );

  const result = await response.json();

  if(!response.ok || !result.ok){
    throw new Error(result.error || "The lead could not be saved.");
  }

  const savedLead = result.lead || {
    ...window.activeLead,
    ...changes
  };

  const savedId = getActiveLeadId(savedLead);

  const leadIndex = allLeads.findIndex(function(lead){
    return getActiveLeadId(lead) === savedId;
  });

  if(leadIndex >= 0){
    allLeads[leadIndex] = savedLead;
  }

  window.activeLead = savedLead;

  renderLeads();

  return savedLead;
}

async function updateLeadStatus(newStatus){
  try{
    const savedLead = await saveActiveLeadChanges({
      status: newStatus
    });

    if(!savedLead) return;

    if(
      newStatus.toLowerCase().includes("closed") ||
      newStatus.toLowerCase().includes("completed")
    ){
      clearDetailPanel();
    }else{
      window.openPanel(savedLead);
    }

    alert("Status permanently saved as: " + newStatus);
  }catch(error){
    console.error(error);
    alert("Status was not saved: " + error.message);
  }
}

async function addNotes(){
  const note = prompt("Add internal note:");
  if(!note || !note.trim()) return;

  const existingNotes =
    typeof window.activeLead?.notes === "string"
      ? window.activeLead.notes.trim()
      : "";

  const datedNote =
    "[" + new Date().toISOString() + "] " + note.trim();

  const updatedNotes =
    existingNotes
      ? existingNotes + "\n" + datedNote
      : datedNote;

  try{
    const savedLead = await saveActiveLeadChanges({
      notes: updatedNotes
    });

    if(!savedLead) return;

    window.openPanel(savedLead);

    alert("Internal note permanently saved.");
  }catch(error){
    console.error(error);
    alert("Note was not saved: " + error.message);
  }
}

function enhancePanelActions(){

  const panel = document.getElementById("detailPanel");

  const actions = document.createElement("div");
  actions.style.marginTop = "20px";
  actions.innerHTML = `
    <hr/>
    <h3>CRM Actions</h3>

    <button onclick="updateLeadStatus('Written Review')" style="width:100%;margin:5px 0;padding:8px;">
      Mark Written Review
    </button>

    <button onclick="updateLeadStatus('Closed')" style="width:100%;margin:5px 0;padding:8px;">
      Move to Closed
    </button>

    <button onclick="updateLeadStatus('Follow-Up Needed')" style="width:100%;margin:5px 0;padding:8px;">
      Flag Follow-Up
    </button>

    <button onclick="addNotes()" style="width:100%;margin:5px 0;padding:8px;">
      Add Internal Note
    </button>
  `;

  panel.appendChild(actions);
}

document.addEventListener("DOMContentLoaded", () => {
  setTimeout(enhancePanelActions, 500);
});
</script>
<script>
(function () {
  function getCrmActionsContainer() {
    const heading = Array.from(document.querySelectorAll("#detailPanel h3"))
      .find(el => el.textContent.trim() === "CRM Actions");

    return heading ? heading.parentElement : null;
  }

  function updateCrmActionVisibility(lead) {
    const actions = getCrmActionsContainer();
    if (!actions) return;

    const status = String(lead?.status || "").toLowerCase();
    const isClosedRecord =
      status.includes("closed") ||
      status.includes("completed");

    const isClosedView =
      typeof currentView !== "undefined" &&
      currentView === "closed";

    actions.style.display =
      isClosedRecord || isClosedView
        ? "none"
        : "block";
  }

  const originalOpenPanel = window.openPanel;

  window.openPanel = function (lead) {
    if (typeof originalOpenPanel === "function") {
      originalOpenPanel(lead);
    }

    window.activeLead = lead || null;
    updateCrmActionVisibility(lead);
  };

  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".sidebar-btn[data-view]").forEach(function (button) {
      button.addEventListener("click", function () {
        if (button.dataset.view === "closed") {
          updateCrmActionVisibility(null);
        }
      });
    });
  });
})();
</script>
</body>
</html>
