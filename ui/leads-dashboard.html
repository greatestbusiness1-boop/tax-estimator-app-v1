<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tax Lead Center</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      color: #12233d;
    }

    .sidebar {
      width: 260px;
      min-height: 100vh;
      background: #0f2c56;
      color: white;
      padding: 20px 16px;
      box-sizing: border-box;
    }

    .sidebar h2 {

    }

    .sidebar-btn {
      display: block;
      width: 100%;
      margin: 0 0 10px;
      padding: 11px;
      background: #28588c;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      text-align: left;
      font-weight: 700;
    }

    .sidebar-btn.active {
      background: white;
      color: #0f2c56;
      border-left: 7px solid #f59e0b;
    }

    .sidebar-group {
      margin: 18px 0 8px;
      padding: 0 4px;

      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #bfdbfe;
    }

    .sidebar-group:first-of-type {

    }

    .sidebar-divider {

      background: rgba(255, 255, 255, 0.16);
    }

    .main {
      flex: 1;

    }

    #leadCount {
      margin-bottom: 18px;
      font-weight: 700;
      color: #52637a;
    }

    .lead-card {
      background: white;

      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .lead-name {
      font-size: 18px;
      font-weight: 900;
      color: #0f2c56;
      margin-bottom: 4px;
    }

    .lead-details {
      font-size: 14px;

      color: #475569;
    }

    .empty,

      background: white;
      border-radius: 10px;
      padding: 18px;
    }

    .error {
      border: 1px solid #ef4444;
      color: #b91c1c;
    }


    .taxprep-filters {

      gap: 8px;

    }

      color: white;

    }

    }

      font-weight: 700;

</head>

<script>
let allLeads = [];
let currentView = "office";
let currentTaxPrepFilter = "all";
let currentContactFilter = "new";

let currentContactMonth = "all";
let currentContactYear = "all";
let currentContactService = "all";
let currentContactStatus = "all";
let currentContactSearch = "";

let currentTaxPrepMonth = "all";
let currentTaxPrepYear = "all";
let currentTaxPrepTaxYear = "all";
let currentTaxPrepLane = "all";
let currentTaxPrepStatus = "all";
let currentTaxPrepSearch = "";

let currentAllMonth = "all";
let currentAllYear = "all";
let currentAllType = "all";
let currentAllStatus = "all";
let currentAllSearch = "";

const closedToday = new Date();
let currentClosedMonth = String(closedToday.getMonth() + 1);
let currentClosedYear = String(closedToday.getFullYear());
let currentClosedService = "all";
let currentClosedSearch = "";

function formatLeadDate(value){
  if(!value) return "";

  const date = new Date(value);

  if(Number.isNaN(date.getTime())){
    return "";
  }

  return date.toLocaleString();
}

function formatDashboardPhone(value){
  const raw = String(value || "").trim();
  const digits = raw.replace(/\D/g, "").slice(0, 10);

  if(digits.length !== 10){
    return raw || "Not provided";
  }

  return `(${digits.slice(0, 3)}) ${digits.slice(3, 6)}-${digits.slice(6)}`;
}

function getLeadEnteredAt(lead){
  return (
    lead.timestamp ||
    lead.createdAt ||
    lead.created_at ||
    ""
  );
}

function getAllLeadTypeKey(lead){
  const status = String(lead?.status || "").toLowerCase();
  const leadId = String(lead?.leadId || "").toLowerCase();

  if(
    status.includes("written review") ||
    lead?.writtenReviewDeliveredAt ||
    lead?.writtenReviewCompletedAt ||
    lead?.writtenReview
  ){
    return "written-review";
  }

  if(
    isTaxPreparationLead(lead) ||
    status.includes("tax preparation")
  ){
    return "tax-preparation";
  }

  if(
    isWebsiteContactLead(lead) ||
    status.includes("contact request")
  ){
    return "website-contact";
  }

  if(
    leadId.includes("transcript") ||
    status.includes("transcript") ||
    lead?.transcriptRequest
  ){
    return "transcript";
  }

  if(
    lead?.estimateSummary ||
    lead?.taxData ||
    leadId.includes("lead-")
  ){
    return "estimate";
  }

  return "other";
}

function getAllLeadTypeLabel(lead){
  const labels = {
    "written-review": "Written Review",
    "tax-preparation": "Tax Preparation",
    "website-contact": "Website Contact",
    "transcript": "Transcript",
    "estimate": "Free Estimate",
    "other": "Other"
  };

  return labels[getAllLeadTypeKey(lead)] || "Other";
}

function getAllLeadTaxYear(lead){
  return String(
    lead?.taxPreparationIntake?.taxYear ||
    lead?.taxData?.taxYear ||
    lead?.estimateSummary?.taxYear ||
    ""
  ).trim();
}

function getAllLeadLatestAction(lead){
  const status = String(lead?.status || "New").trim();

  if(lead?.writtenReviewDeliveredAt){
    return "Written review delivered";
  }

  if(lead?.writtenReviewCompletedAt){
    return "Written review completed";
  }

  if(lead?.Request?.officeWorkCompletedAt || lead?.completedAt){
    return "Office work completed";
  }

  if(getContactRepliedAt(lead)){
    return "Website contact replied";
  }

  if(status.toLowerCase().includes("ready to schedule")){
    return "Ready to schedule";
  }

  if(status.toLowerCase().includes("needs review")){
    return "Needs review";
  }

  return status || "New";
}

function matchesAllLeadFilters(lead){
  const enteredAt = getLeadEnteredAt(lead);
  const enteredDate = enteredAt ? new Date(enteredAt) : null;
  const validDate =
    enteredDate &&
    !Number.isNaN(enteredDate.getTime());

  if(currentAllYear !== "all"){
    if(
      !validDate ||
      String(enteredDate.getFullYear()) !== currentAllYear
    ){
      return false;
    }
  }

  if(currentAllMonth !== "all"){
    if(
      !validDate ||
      String(enteredDate.getMonth() + 1) !== currentAllMonth
    ){
      return false;
    }
  }

  if(
    currentAllType !== "all" &&
    getAllLeadTypeKey(lead) !== currentAllType
  ){
    return false;
  }

  if(
    currentAllStatus !== "all" &&
    String(lead?.status || "New") !== currentAllStatus
  ){
    return false;
  }

  if(currentAllSearch){
    const haystack = [
      lead?.contact?.name,
      lead?.contact?.email,
      lead?.contact?.phone,
      lead?.status,
      getAllLeadTypeLabel(lead)
    ].join(" ").toLowerCase();

    if(!haystack.includes(currentAllSearch.toLowerCase())){
      return false;
    }
  }

  return true;
}

function populateAllLeadFilters(){
  const yearSelect = document.getElementById("allYearFilter");
  const statusSelect = document.getElementById("allStatusFilter");

  if(yearSelect){
    const years = new Set();

    allLeads.forEach(lead => {
      const enteredAt = getLeadEnteredAt(lead);
      if(!enteredAt) return;

      const date = new Date(enteredAt);
      if(!Number.isNaN(date.getTime())){
        years.add(date.getFullYear());
      }
    });

    const sortedYears = Array.from(years).sort((a,b) => b - a);

    yearSelect.innerHTML =
      '<option value="all">All years</option>' +
      sortedYears
        .map(year => `<option value="${year}">${year}</option>`)
        .join("");

    yearSelect.value =
      sortedYears.includes(Number(currentAllYear))
        ? currentAllYear
        : "all";

    currentAllYear = yearSelect.value;
  }

  if(statusSelect){
    const statuses = Array.from(
      new Set(
        allLeads
          .map(lead => String(lead?.status || "New").trim())
          .filter(Boolean)
      )
    ).sort((a,b) => a.localeCompare(b));

    statusSelect.innerHTML =
      '<option value="all">All statuses</option>' +
      statuses
        .map(status =>
          `<option value="${status.replace(/"/g, "&quot;")}">${status}</option>`
        )
        .join("");

    statusSelect.value =
      statuses.includes(currentAllStatus)
        ? currentAllStatus
        : "all";

    currentAllStatus = statusSelect.value;
  }
}

function updateAllSummary(count){
  const summary = document.getElementById("allSummary");
  if(!summary) return;

  const monthNames = [
    "",
    "January",
    "February",

function getLeadClosedAt(lead){
  return (
    lead.writtenReviewDeliveredAt ||
    lead.writtenReviewCompletedAt ||
    lead.closedAt ||
    lead.completedAt ||
    lead.contactRequest?.repliedAt ||
    lead.Request?.contactRequestRepliedAt ||
    lead.Request?.officeWorkCompletedAt ||
    lead.writtenReview?.deliveredAt ||
    lead.writtenReview?.completedAt ||
    (
      String(lead.status || "").toLowerCase().includes("closed") ||
      String(lead.status || "").toLowerCase().includes("completed")
        ? lead.updatedAt
        : ""
    ) ||
    ""
  );
}

function getClosedServiceKey(lead){
  const status = String(lead?.status || "").toLowerCase();
  const leadId = String(lead?.leadId || "").toLowerCase();

  if(
    status.includes("written review") ||
    lead?.writtenReviewDeliveredAt ||
    lead?.writtenReviewCompletedAt ||
    lead?.writtenReview
  ){
    return "written-review";
  }

  if(
    isTaxPreparationLead(lead) ||
    status.includes("tax preparation")
  ){
    return "tax-preparation";
  }

  if(
    isWebsiteContactLead(lead) ||
    status.includes("contact request")
  ){
    return "website-contact";
  }

  if(
    leadId.includes("transcript") ||
    status.includes("transcript") ||
    lead?.transcriptRequest
  ){
    return "transcript";
  }

  return "other";
}

function getClosedServiceLabel(lead){
  const labels = {
    "written-review": "Written Review",
    "tax-preparation": "Tax Preparation",
    "website-contact": "Website Contact",
    "transcript": "Transcript",
    "other": "Other"
  };

  return labels[getClosedServiceKey(lead)] || "Other";
}

function matchesClosedFilters(lead){
  const closedAt = getLeadClosedAt(lead);
  const date = closedAt ? new Date(closedAt) : null;
  const validDate = date && !Number.isNaN(date.getTime());

  if(currentClosedYear !== "all"){
    if(!validDate || String(date.getFullYear()) !== currentClosedYear){
      return false;
    }
  }

  if(currentClosedMonth !== "all"){
    if(!validDate || String(date.getMonth() + 1) !== currentClosedMonth){
      return false;
    }
  }

  if(
    currentClosedService !== "all" &&
    getClosedServiceKey(lead) !== currentClosedService
  ){
    return false;
  }

  if(currentClosedSearch){
    const haystack = [
      lead?.contact?.name,
      lead?.contact?.email,
      lead?.status,
      getClosedServiceLabel(lead)
    ].join(" ").toLowerCase();

    if(!haystack.includes(currentClosedSearch.toLowerCase())){
      return false;
    }
  }

  return true;
}

function getTaxPrepLane(lead){
  const lane = String(
    lead?.taxPreparationIntake?.recommendedLane || ""
  ).trim();

  if(lane === "Simple Individual Return"){
    return "Individual Form 1040";
  }

  return lane;
}

function getTaxPrepDocumentCount(lead){
  const value = Number(lead?.taxPreparationIntake?.documentCount || 0);
  return Number.isFinite(value) ? value : 0;
}

function getTaxPrepStateDisplay(lead){
  const intake = lead?.taxPreparationIntake || {};
  const stateCount = Number(intake.stateCount || 1);
  const state = intake.primaryState || lead?.taxData?.stateCode || "";
  return stateCount > 1
    ? `${state || "Multi-state"} + ${stateCount - 1} more`
    : (state || "Not provided");
}

function matchesTaxPrepFilter(lead){
  const status = String(lead?.status || "").toLowerCase();
  const lane = getTaxPrepLane(lead).toLowerCase();
  const isCompleted =
    status.includes("completed") ||
    status.includes("closed");

  if(currentTaxPrepFilter === "new") return status.includes("ready to schedule");
  if(currentTaxPrepFilter === "simple") return !isCompleted && (lane.includes("individual form 1040") || lane.includes("simple individual"));
  if(currentTaxPrepFilter === "gig") return !isCompleted && (lane.includes("gig worker") || lane.includes("self-employed"));
  if(currentTaxPrepFilter === "complex") return !isCompleted && (lane.includes("investment") || lane.includes("complex"));
  if(currentTaxPrepFilter === "business") return !isCompleted && (lane.includes("business") || lane.includes("entity"));
  if(currentTaxPrepFilter === "review") return !isCompleted && (status.includes("needs review") || Boolean(lead?.taxPreparationIntake?.needsProfessionalReview));
  if(currentTaxPrepFilter === "completed") return isCompleted;

  // "All Tax Preparation" is the active worklist.
  return !isCompleted;
}

  const taxPrepLeads = allLeads.filter(isTaxPreparationLead);

  if(yearSelect){
    const years = new Set();

    taxPrepLeads.forEach(lead => {

        .join("");

    yearSelect.value = sortedYears.includes(Number(currentTaxPrepYear))
      ? currentTaxPrepYear
      : "all";

    currentTaxPrepYear = yearSelect.value;
  }

  if(taxYearSelect){
    const taxYears = Array.from(
      new Set(
        taxPrepLeads
          .map(getTaxPrepTaxYear)
          .filter(Boolean)
      )
    ).sort((a,b) => Number(b) - Number(a));

    taxYearSelect.innerHTML =
      '<option value="all">All tax years</option>' +
      taxYears
        .map(year => `<option value="${year}">${year}</option>`)
        .join("");

    taxYearSelect.value = taxYears.includes(currentTaxPrepTaxYear)
      ? currentTaxPrepTaxYear
      : "all";

    currentTaxPrepTaxYear = taxYearSelect.value;
  }

  if(laneSelect){
    const standardLanes = [
      "Individual Form 1040",
      "Gig / Self-Employed Form 1040",
      "Investment & Complex Form 1040",
      "Business / Entity Return"
    ];

    const lanes = Array.from(
      new Set([
        ...standardLanes,
        ...taxPrepLeads
          .map(getTaxPrepLane)
          .filter(Boolean)
      ])
    ).sort((a,b) => {
      const aIndex = standardLanes.indexOf(a);
      const bIndex = standardLanes.indexOf(b);

      if(aIndex !== -1 && bIndex !== -1) return aIndex - bIndex;
      if(aIndex !== -1) return -1;
      if(bIndex !== -1) return 1;
      return a.localeCompare(b);
    });

    laneSelect.innerHTML =
      '<option value="all">All service lanes</option>' +
      lanes
        .map(lane => `<option value="${lane}">${lane}</option>`)
        .join("");

    laneSelect.value = lanes.includes(currentTaxPrepLane)

  if(statusSelect){

      new Set(
        taxPrepLeads

    ).sort((a,b) => a.localeCompare(b));

        .map(status => `<option value="${status}">${status}</option>`)
        .join("");

    statusSelect.value = statuses.includes(currentTaxPrepStatus)
      ? currentTaxPrepStatus
      : "all";

    currentTaxPrepStatus = statusSelect.value;
  }
}

function getVisibleLeads(){
  if(currentView==="websitecontact"){
    return allLeads
      .filter(isWebsiteContactLead)
      .filter(matchesContactFilter)
      .filter(matchesContactAdvancedFilters)
      .sort((a,b) => new Date(getLeadEnteredAt(b) || 0) - new Date(getLeadEnteredAt(a) || 0));
  }

  if(currentView==="taxprep"){
    return allLeads
      .filter(isTaxPreparationLead)
      .filter(matchesTaxPrepFilter)
      .filter(matchesTaxPrepAdvancedFilters)
      .sort((a,b) => new Date(getLeadEnteredAt(b) || 0) - new Date(getLeadEnteredAt(a) || 0));
  }

  if(currentView==="written"){
    return allLeads.filter(l => {
      const status = String(l.status || "").toLowerCase();

      const isWrittenReview =
        status.includes("written review");

      const isFinished =
        status.includes("closed") ||
        status.includes("completed");

      return isWrittenReview && !isFinished;
    });
  }

  if(currentView==="closed"){
    return allLeads
      .filter(l => {
        const s=(l.status||"").toLowerCase();
        return s.includes("closed")||s.includes("completed");
      })
      .filter(matchesClosedFilters)
      .sort((a,b) =>
        new Date(getLeadClosedAt(b) || 0) -
        new Date(getLeadClosedAt(a) || 0)
      );
  }

  if(currentView==="all"){
    return allLeads
      .filter(matchesAllLeadFilters)
      .sort((a,b) =>
        new Date(getLeadEnteredAt(b) || 0) -
        new Date(getLeadEnteredAt(a) || 0)
      );
  }

  if(currentView==="office"){
    return allLeads.filter(l => {
      const status = String(l.status || "").toLowerCase();

      const isClosed =
        status.includes("closed") ||
        status.includes("completed");

      const requiresAttention =
        status.includes("needs written review") ||
        status.includes("needs review") ||
        status.includes("needs attention") ||
        status.includes("action required") ||
        status.includes("follow-up needed") ||
        status.includes("missing information") ||
        status.includes("report failed") ||
        status.includes("email failed") ||
        status.includes("delivery failed") ||
        status.includes("overdue") ||
        status.includes("error");

      return !isClosed && requiresAttention;
    });
  }

  return allLeads;
}

function getOfficeServiceLabel(lead){

async function markOfficeWorkCompleted(index, button){
  const lead = (window.visibleOfficeLeads || [])[index];

  if(!lead || !lead.leadId){
    alert("Office work item could not be identified.");
    return;
  }

  const clientName = String(
    lead?.contact?.name || "this client"
  ).trim();

  const serviceName = String(
    getOfficeServiceLabel(lead) || "office work"
  ).trim();

  const confirmed = window.confirm(
    `Mark ${clientName}'s ${serviceName} completed and move the client to Closed Leads?`
  );

  if(!confirmed) return;

  const originalText = button ? button.textContent : "Mark Completed";

  if(button){
    button.disabled = true;
    button.textContent = "Updating...";
    button.setAttribute("aria-busy", "true");
  }

  try{
    const completedAt = new Date().toISOString();

    const response = await fetch(
      "/api/leads/" + encodeURIComponent(lead.leadId),
      {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          status: "Closed - Office Work Completed",
          completedAt,
          closedAt: completedAt,
          Request: {
            officeWorkCompletionStatus: "Completed",
            officeWorkCompletedAt: completedAt,
            officeWorkPreviousStatus: String(lead.status || "")
          }
        })
      }
    );

    const result = await response.json();

    if(!response.ok || !result.ok){
      throw new Error(
        result.error || "The office work item could not be completed."
      );
    }

    if(button){
      button.textContent = "Completed";
      button.removeAttribute("aria-busy");
    }

    lead.status = "Closed - Office Work Completed";
    lead.completedAt = completedAt;
    lead.closedAt = completedAt;
    lead.Request = {
      ...(lead.Request || {}),
      officeWorkCompletionStatus: "Completed",
      officeWorkCompletedAt: completedAt
    };

    clearDetailPanel();

    setTimeout(async () => {
      await loadLeads();
      alert(
        `${clientName}'s ${serviceName} is completed and has moved to Closed Leads.`
      );
    }, 550);
  }catch(error){
    if(button){
      button.disabled = false;
      button.textContent = originalText;
      button.removeAttribute("aria-busy");
    }

    alert(
      error && error.message
        ? error.message
        : "The office work item could not be completed."
    );
  }
}

async function markWrittenReviewDelivered(index, button){

  }

  try{

      {

        }
      }

    }
