<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tax Lead Center</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      color: #12233d;
    }

    .sidebar {
      width: 260px;
      min-height: 100vh;
      background: #0f2c56;
      color: white;
      padding: 20px 16px;
      box-sizing: border-box;
    }

    .sidebar h2 {
      margin: 0 0 20px;
    }

    .sidebar-btn {
      display: block;
      width: 100%;
      margin: 0 0 10px;
      padding: 11px;
      background: #28588c;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      text-align: left;
      font-weight: 700;
    }

    .sidebar-btn.active {
      background: white;
      color: #0f2c56;
      border-left: 7px solid #f59e0b;
    }

    .main {
      flex: 1;
      padding: 24px;
      box-sizing: border-box;
    }

    #leadCount {
      margin-bottom: 18px;
      font-weight: 700;
      color: #52637a;
    }

    .lead-card {
      background: white;
      border: 1px solid #dbe4f0;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .lead-name {
      font-size: 18px;
      font-weight: 900;
      color: #0f2c56;
      margin-bottom: 4px;
    }

    .lead-details {
      font-size: 14px;
      line-height: 1.5;
      color: #475569;
    }

    .empty,
    .error {
      background: white;
      border-radius: 10px;
      padding: 18px;
    }

    .error {
      border: 1px solid #ef4444;
      color: #b91c1c;
    }


    .taxprep-filters {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 18px;
    }

    .contact-filters {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 18px;
    }

    .contact-filter-btn {
      border: 1px solid #b9c8d9;
      background: white;
      color: #17324d;
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .contact-filter-btn.active {
      background: #17324d;
      color: white;
      border-color: #17324d;
    }

    .contact-replied-btn {
      border: 0;
      border-radius: 6px;
      background: #28588c;
      color: white;
      padding: 7px 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .contact-replied-btn[disabled] {
      background: #64748b;
      cursor: default;
    }

    .taxprep-filter-btn {
      border: 1px solid #b9c8d9;
      background: white;
      color: #17324d;
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .taxprep-filter-btn.active {
      background: #17324d;
      color: white;
      border-color: #17324d;
    }

    .taxprep-table-wrap {
      background: white;
      border: 1px solid #dbe4f0;
      border-radius: 10px;
      overflow-x: auto;
    }

    .taxprep-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
    }

    .taxprep-table th,
    .taxprep-table td {
      padding: 11px 12px;
      border-bottom: 1px solid #e5eaf0;
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }

    .taxprep-table th {
      background: #eef3f8;
      color: #17324d;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .taxprep-open-btn {
      border: 0;
      border-radius: 6px;
      background: #28588c;
      color: white;
      padding: 7px 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .status-pill {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: #eef3f8;
      color: #17324d;
      font-weight: 700;
      white-space: nowrap;
    }

  
    .written-action-btn {
      border: 0;
      border-radius: 6px;
      background: #28588c;
      color: #ffffff;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
      min-width: 118px;
    }

    .written-action-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .autopilot-complete {
      color: #166534;
      font-weight: 700;
    }

    .autopilot-ready {
      color: #92400e;
      font-weight: 700;
    }

  
    .closed-filters {
      display: none;
      flex-wrap: wrap;
      gap: 10px;
      align-items: end;
      margin: 14px 0 18px;
      padding: 14px;
      background: #ffffff;
      border: 1px solid #dbe4f0;
      border-radius: 10px;
    }

    .closed-filter-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 145px;
    }

    .closed-filter-field label {
      font-size: 12px;
      font-weight: 700;
      color: #334155;
    }

    .closed-filter-field select,
    .closed-filter-field input {
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      padding: 9px 10px;
      font: inherit;
      background: #ffffff;
    }

    .closed-filter-field.closed-search {
      min-width: 230px;
      flex: 1;
    }

    .closed-summary {
      width: 100%;
      font-weight: 700;
      color: #0f2f59;
      padding-top: 2px;
    }

    .closed-open-btn {
      border: 0;
      border-radius: 6px;
      background: #28588c;
      color: #ffffff;
      padding: 8px 13px;
      font-weight: 700;
      cursor: pointer;
    }

  </style>
</head>

<body>
  <aside class="sidebar">
    <h2>Tax Lead Center</h2>

    <button class="sidebar-btn active" data-view="office">Office Work Queue</button>
    <button class="sidebar-btn" data-view="all">All Leads</button>
    <button class="sidebar-btn" data-view="written">Written Review Requests</button>
    <button class="sidebar-btn" data-view="taxprep">Tax Preparation Requests</button>
    <button class="sidebar-btn" data-view="websitecontact">Website Contact Requests</button>
    <button class="sidebar-btn" data-view="closed">Closed Leads</button>
    <button class="sidebar-btn" onclick="window.location.href='/transcript-requests'">New Transcript Requests</button>
  </aside>

  <main class="main">
    <h1 id="viewTitle">Office Work Queue</h1>
    <div id="leadCount"> </div>

    <div id="taxPrepFilters" class="taxprep-filters">
      <button class="taxprep-filter-btn active" data-taxprep-filter="all">All Tax Preparation</button>
      <button class="taxprep-filter-btn" data-taxprep-filter="new">New Intakes</button>
      <button class="taxprep-filter-btn" data-taxprep-filter="simple">Simple Individual</button>
      <button class="taxprep-filter-btn" data-taxprep-filter="gig">Gig / Self-Employed</button>
      <button class="taxprep-filter-btn" data-taxprep-filter="complex">Investment & Complex</button>
      <button class="taxprep-filter-btn" data-taxprep-filter="business">Business / Entity</button>
      <button class="taxprep-filter-btn" data-taxprep-filter="review">Needs Review</button>
      <button class="taxprep-filter-btn" data-taxprep-filter="completed">Completed</button>
    </div>

    <div id="contactFilters" class="contact-filters">
      <button class="contact-filter-btn active" data-contact-filter="new">New Requests</button>
      <button class="contact-filter-btn" data-contact-filter="all">All Website Contacts</button>
      <button class="contact-filter-btn" data-contact-filter="replied">Replied</button>
    </div>

    <div id="closedFilters" class="closed-filters">
      <div class="closed-filter-field">
        <label for="closedMonthFilter">Month closed</label>
        <select id="closedMonthFilter">
          <option value="all">All months</option>
          <option value="1">January</option>
          <option value="2">February</option>
          <option value="3">March</option>
          <option value="4">April</option>
          <option value="5">May</option>
          <option value="6">June</option>
          <option value="7">July</option>
          <option value="8">August</option>
          <option value="9">September</option>
          <option value="10">October</option>
          <option value="11">November</option>
          <option value="12">December</option>
        </select>
      </div>

      <div class="closed-filter-field">
        <label for="closedYearFilter">Year closed</label>
        <select id="closedYearFilter">
          <option value="all">All years</option>
        </select>
      </div>

      <div class="closed-filter-field">
        <label for="closedServiceFilter">Service</label>
        <select id="closedServiceFilter">
          <option value="all">All services</option>
          <option value="written-review">Written Review</option>
          <option value="tax-preparation">Tax Preparation</option>
          <option value="website-contact">Website Contact</option>
          <option value="transcript">Transcript</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="closed-filter-field closed-search">
        <label for="closedSearchFilter">Search client</label>
        <input
          id="closedSearchFilter"
          type="search"
          placeholder="Name or email"
          autocomplete="off"
        >
      </div>

      <div id="closedSummary" class="closed-summary"></div>
    </div>

    <div id="leadList"></div>
  </main>

  
<div id="detailPanel" style="
  position: fixed;
  right: 0;
  top: 0;
  width: 360px;
  height: 100vh;
  background: #ffffff;
  border-left: 1px solid #dbe4f0;
  box-shadow: -10px 0 30px rgba(0,0,0,0.08);
  padding: 16px;
  overflow-y: auto;
  display: none;
  z-index: 9999;
">
  <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
    <button
      type="button"
      onclick="clearDetailPanel()"
      style="border:1px solid #cbd5e1;background:#f8fafc;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;"
    >
      Close
    </button>
  </div>
  <h2 id="dpName">Lead Details</h2>
  <div id="dpEmail"></div>
  <div id="dpStatus"></div>
  <div id="dpTaxYear"></div>
  <div id="dpRefund"></div>
  <div id="dpEntered"></div>
  <div id="dpClosed"></div>
</div>



<script>
let allLeads = [];
let currentView = "office";
let currentTaxPrepFilter = "all";
let currentContactFilter = "new";

const closedToday = new Date();
let currentClosedMonth = String(closedToday.getMonth() + 1);
let currentClosedYear = String(closedToday.getFullYear());
let currentClosedService = "all";
let currentClosedSearch = "";

function formatLeadDate(value){
  if(!value) return "";

  const date = new Date(value);

  if(Number.isNaN(date.getTime())){
    return "";
  }

  return date.toLocaleString();
}

function formatDashboardPhone(value){
  const raw = String(value || "").trim();
  const digits = raw.replace(/\D/g, "").slice(0, 10);

  if(digits.length !== 10){
    return raw || "Not provided";
  }

  return `(${digits.slice(0, 3)}) ${digits.slice(3, 6)}-${digits.slice(6)}`;
}

function getLeadEnteredAt(lead){
  return (
    lead.timestamp ||
    lead.createdAt ||
    lead.created_at ||
    ""
  );
}

function getLeadClosedAt(lead){
  return (
    lead.writtenReviewDeliveredAt ||
    lead.writtenReviewCompletedAt ||
    lead.closedAt ||
    lead.completedAt ||
    lead.contactRequest?.repliedAt ||
    lead.Request?.contactRequestRepliedAt ||
    lead.writtenReview?.deliveredAt ||
    lead.writtenReview?.completedAt ||
    (
      String(lead.status || "").toLowerCase().includes("closed") ||
      String(lead.status || "").toLowerCase().includes("completed")
        ? lead.updatedAt
        : ""
    ) ||
    ""
  );
}

function getClosedServiceKey(lead){
  const status = String(lead?.status || "").toLowerCase();
  const leadId = String(lead?.leadId || "").toLowerCase();

  if(
    status.includes("written review") ||
    lead?.writtenReviewDeliveredAt ||
    lead?.writtenReviewCompletedAt ||
    lead?.writtenReview
  ){
    return "written-review";
  }

  if(
    isTaxPreparationLead(lead) ||
    status.includes("tax preparation")
  ){
    return "tax-preparation";
  }

  if(
    isWebsiteContactLead(lead) ||
    status.includes("contact request")
  ){
    return "website-contact";
  }

  if(
    leadId.includes("transcript") ||
    status.includes("transcript") ||
    lead?.transcriptRequest
  ){
    return "transcript";
  }

  return "other";
}

function getClosedServiceLabel(lead){
  const labels = {
    "written-review": "Written Review",
    "tax-preparation": "Tax Preparation",
    "website-contact": "Website Contact",
    "transcript": "Transcript",
    "other": "Other"
  };

  return labels[getClosedServiceKey(lead)] || "Other";
}

function matchesClosedFilters(lead){
  const closedAt = getLeadClosedAt(lead);
  const date = closedAt ? new Date(closedAt) : null;
  const validDate = date && !Number.isNaN(date.getTime());

  if(currentClosedYear !== "all"){
    if(!validDate || String(date.getFullYear()) !== currentClosedYear){
      return false;
    }
  }

  if(currentClosedMonth !== "all"){
    if(!validDate || String(date.getMonth() + 1) !== currentClosedMonth){
      return false;
    }
  }

  if(
    currentClosedService !== "all" &&
    getClosedServiceKey(lead) !== currentClosedService
  ){
    return false;
  }

  if(currentClosedSearch){
    const haystack = [
      lead?.contact?.name,
      lead?.contact?.email,
      lead?.status,
      getClosedServiceLabel(lead)
    ].join(" ").toLowerCase();

    if(!haystack.includes(currentClosedSearch.toLowerCase())){
      return false;
    }
  }

  return true;
}

function populateClosedYearFilter(){
  const select = document.getElementById("closedYearFilter");
  if(!select) return;

  const years = new Set([new Date().getFullYear()]);

  allLeads.forEach(lead => {
    const closedAt = getLeadClosedAt(lead);
    if(!closedAt) return;

    const date = new Date(closedAt);
    if(!Number.isNaN(date.getTime())){
      years.add(date.getFullYear());
    }
  });

  const sortedYears = Array.from(years).sort((a,b) => b - a);

  select.innerHTML =
    '<option value="all">All years</option>' +
    sortedYears
      .map(year => `<option value="${year}">${year}</option>`)
      .join("");

  select.value = sortedYears.includes(Number(currentClosedYear))
    ? currentClosedYear
    : "all";

  currentClosedYear = select.value;
}

function updateClosedSummary(count){
  const summary = document.getElementById("closedSummary");
  if(!summary) return;

  const monthNames = [
    "",
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December"
  ];

  const period =
    currentClosedMonth === "all" && currentClosedYear === "all"
      ? "all time"
      : currentClosedMonth === "all"
        ? currentClosedYear
        : currentClosedYear === "all"
          ? monthNames[Number(currentClosedMonth)]
          : `${monthNames[Number(currentClosedMonth)]} ${currentClosedYear}`;

  summary.textContent =
    `Closed in ${period}: ${count} ${count === 1 ? "lead" : "leads"}`;
}

function isTaxPreparationLead(lead){
  return Boolean(lead && lead.taxPreparationIntake) ||
    String(lead?.leadId || "").startsWith("TAXPREP-") ||
    String(lead?.status || "").toLowerCase().includes("tax preparation intake");
}

function isWebsiteContactLead(lead){
  return Boolean(lead && lead.contactRequest) ||
    String(lead?.leadId || "").startsWith("CONTACT-") ||
    String(lead?.status || "").toLowerCase().includes("contact request");
}

function getContactRepliedAt(lead){
  return (
    lead?.Request?.contactRequestRepliedAt ||
    lead?.Request?.repliedAt ||
    lead?.contactRequest?.repliedAt ||
    ""
  );
}

function matchesContactFilter(lead){
  const status = String(lead?.status || "").toLowerCase();
  const replied = status.includes("replied") || Boolean(getContactRepliedAt(lead));

  if(currentContactFilter === "new") return !replied;
  if(currentContactFilter === "replied") return replied;
  return true;
}

function getTaxPrepLane(lead){
  return String(lead?.taxPreparationIntake?.recommendedLane || "").trim();
}

function getTaxPrepDocumentCount(lead){
  const value = Number(lead?.taxPreparationIntake?.documentCount || 0);
  return Number.isFinite(value) ? value : 0;
}

function getTaxPrepStateDisplay(lead){
  const intake = lead?.taxPreparationIntake || {};
  const stateCount = Number(intake.stateCount || 1);
  const state = intake.primaryState || lead?.taxData?.stateCode || "";
  return stateCount > 1
    ? `${state || "Multi-state"} + ${stateCount - 1} more`
    : (state || "Not provided");
}

function matchesTaxPrepFilter(lead){
  const status = String(lead?.status || "").toLowerCase();
  const lane = getTaxPrepLane(lead).toLowerCase();

  if(currentTaxPrepFilter === "new") return status.includes("ready to schedule");
  if(currentTaxPrepFilter === "simple") return lane.includes("simple individual");
  if(currentTaxPrepFilter === "gig") return lane.includes("gig worker") || lane.includes("self-employed");
  if(currentTaxPrepFilter === "complex") return lane.includes("investment") || lane.includes("complex");
  if(currentTaxPrepFilter === "business") return lane.includes("business") || lane.includes("entity");
  if(currentTaxPrepFilter === "review") return status.includes("needs review") || Boolean(lead?.taxPreparationIntake?.needsProfessionalReview);
  if(currentTaxPrepFilter === "completed") return status.includes("completed") || status.includes("closed");
  return true;
}

function getVisibleLeads(){
  if(currentView==="websitecontact"){
    return allLeads
      .filter(isWebsiteContactLead)
      .filter(matchesContactFilter)
      .sort((a,b) => new Date(getLeadEnteredAt(b) || 0) - new Date(getLeadEnteredAt(a) || 0));
  }

  if(currentView==="taxprep"){
    return allLeads
      .filter(isTaxPreparationLead)
      .filter(matchesTaxPrepFilter)
      .sort((a,b) => new Date(getLeadEnteredAt(b) || 0) - new Date(getLeadEnteredAt(a) || 0));
  }

  if(currentView==="written"){
    return allLeads.filter(l => {
      const status = String(l.status || "").toLowerCase();

      const isWrittenReview =
        status.includes("written review");

      const isFinished =
        status.includes("closed") ||
        status.includes("completed");

      return isWrittenReview && !isFinished;
    });
  }

  if(currentView==="closed"){
    return allLeads
      .filter(l => {
        const s=(l.status||"").toLowerCase();
        return s.includes("closed")||s.includes("completed");
      })
      .filter(matchesClosedFilters)
      .sort((a,b) =>
        new Date(getLeadClosedAt(b) || 0) -
        new Date(getLeadClosedAt(a) || 0)
      );
  }

  if(currentView==="office"){
    return allLeads.filter(l => {
      const status = String(l.status || "").toLowerCase();

      const isClosed =
        status.includes("closed") ||
        status.includes("completed");

      const requiresAttention =
        status.includes("needs written review") ||
        status.includes("needs review") ||
        status.includes("needs attention") ||
        status.includes("action required") ||
        status.includes("follow-up needed") ||
        status.includes("missing information") ||
        status.includes("report failed") ||
        status.includes("email failed") ||
        status.includes("delivery failed") ||
        status.includes("overdue") ||
        status.includes("error");

      return !isClosed && requiresAttention;
    });
  }

  return allLeads;
}

function openPanel(lead){
  const panel=document.getElementById("detailPanel");
  panel.style.display="block";

  document.getElementById("dpName").innerText = lead.contact?.name || "No Name";
  document.getElementById("dpEmail").innerText = lead.contact?.email || "No Email";
  document.getElementById("dpStatus").innerText = "Status: " + (lead.status||"New");
  document.getElementById("dpTaxYear").innerText = "Tax Year: " + (lead.taxData?.taxYear || "");
  const intake = lead.taxPreparationIntake || null;
  const contactRequest = lead.contactRequest || null;

  document.getElementById("dpRefund").innerText = contactRequest
    ? "Service: " + (contactRequest.service || "General Question") +
      "\nPreferred Contact: " + (contactRequest.preferredContact || "Not provided") +
      "\nPhone: " + (lead.contact?.phone || "Not provided") +
      "\n\nMessage:\n" + (contactRequest.message || "")
    : intake
      ? "Recommended Service: " + (intake.recommendedLane || "Not assigned")
      : "Refund: $" + (lead.estimateSummary?.combined?.refundAmount || 0);

  if(intake){
    document.getElementById("dpTaxYear").innerText =
      "Tax Year: " + (intake.taxYear || lead.taxData?.taxYear || "");
  }

  const enteredAt = formatLeadDate(getLeadEnteredAt(lead));
  const closedAt = formatLeadDate(getLeadClosedAt(lead));

  document.getElementById("dpEntered").innerText =
    enteredAt ? "Entered: " + enteredAt : "";

  document.getElementById("dpClosed").innerText =
    closedAt ? "Closed: " + closedAt : "";
}

function getWrittenWorksheetCompleted(lead){
  const request = lead?.Request || lead?.request || {};

  return Boolean(request.clientTaxStrategyWorksheet) &&
    (
      request.clientTaxStrategyWorksheetStatus === "Completed" ||
      Boolean(request.clientTaxStrategyWorksheetCompletedAt)
    );
}

function getWrittenDeliveredAt(lead){
  return (
    lead?.writtenReviewDeliveredAt ||
    lead?.writtenReviewCompletedAt ||
    lead?.writtenReview?.deliveredAt ||
    lead?.writtenReview?.completedAt ||
    ""
  );
}

function getWrittenAutopilotStatus(lead){
  const status = String(lead?.status || "").toLowerCase();

  if(
    getWrittenDeliveredAt(lead) ||
    status.includes("closed") ||
    status.includes("completed")
  ){
    return "Completed / No action needed";
  }

  if(getWrittenWorksheetCompleted(lead)){
    return "Ready to Deliver";
  }

  return "Waiting for Client Worksheet";
}

function renderLeads(){
  const list=document.getElementById("leadList");
  const visible=getVisibleLeads();
  const count=document.getElementById("leadCount");

  count.innerText = visible.length + (visible.length === 1 ? " lead" : " leads");

  if(!visible.length){
    list.innerHTML="<div class='empty'>No leads found</div>";
    return;
  }

  if(currentView === "written"){
    list.innerHTML = `
      <div class="taxprep-table-wrap">
        <table class="taxprep-table">
          <thead>
            <tr>
              <th>Client</th>
              <th>Tax Year</th>
              <th>Autopilot Status</th>
              <th>Worksheet</th>
              <th>Entered</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            ${visible.map((lead, index) => {
              const worksheetCompleted = getWrittenWorksheetCompleted(lead);
              const autopilotStatus = getWrittenAutopilotStatus(lead);
              const enteredAt = formatLeadDate(getLeadEnteredAt(lead));
              const delivered = autopilotStatus === "Completed / No action needed";

              return `
                <tr>
                  <td>
                    <strong>${lead.contact?.name || "No Name"}</strong><br>
                    ${lead.contact?.email || ""}
                  </td>
                  <td>${lead.taxData?.taxYear || ""}</td>
                  <td class="${delivered ? "autopilot-complete" : "autopilot-ready"}">
                    ${autopilotStatus}
                  </td>
                  <td>${worksheetCompleted ? "Completed" : "Waiting"}</td>
                  <td>${enteredAt}</td>
                  <td>
                    ${
                      worksheetCompleted
                        ? `
                          <button
                            class="written-action-btn"
                            onclick="markWrittenReviewDelivered(${index}, this)"
                          >
                            Mark Delivered
                          </button>
                        `
                        : `<span class="status-pill">No action needed</span>`
                    }
                  </td>
                </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>`;

async function markWrittenReviewDelivered(index, button){
  const lead = (window.visibleWrittenReviewLeads || [])[index];

  if(!lead || !lead.leadId){
    alert("Written Review could not be identified.");
    return;
  }

  const originalText = button ? button.textContent : "Mark Delivered";

  if(button){
    button.disabled = true;
    button.textContent = "Updating...";
    button.setAttribute("aria-busy", "true");
  }

  try{
    const response = await fetch(
      "/api/written-review/" +
        encodeURIComponent(lead.leadId) +
        "/mark-delivered",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        }
      }
    );

    const result = await response.json();

    if(!response.ok || !result.ok){
      throw new Error(
        result.error ||
        "The Written Review could not be marked delivered."
      );
    }

    if(button){
      button.textContent = "Marked Delivered";
      button.removeAttribute("aria-busy");
    }

    const nowIso =
      result.deliveredAt ||
      new Date().toISOString();

    lead.writtenReviewDeliveredAt = nowIso;
    lead.writtenReviewDeliveryStatus = "Delivered";
    lead.writtenReviewCompletedAt = nowIso;
    lead.writtenReviewCompletedStatus = "Completed";
    lead.status = "Closed - Written Review Completed";
    lead.closedAt = nowIso;

    clearDetailPanel();

    setTimeout(async () => {
      await loadLeads();
    }, 550);
  }catch(error){
    if(button){
      button.disabled = false;
      button.textContent = originalText;
      button.removeAttribute("aria-busy");
    }

    alert(
      error && error.message
        ? error.message
        : "The Written Review could not be marked delivered."
    );
  }
}

async function markContactReplied(index, button){
  const lead = (window.visibleWebsiteContactLeads || [])[index];

  if(!lead || !lead.leadId){
    alert("Contact request could not be identified.");
    return;
  }

  const originalText = button ? button.textContent : "Replied";

  if(button){
    button.disabled = true;
    button.textContent = "Updating...";
    button.setAttribute("aria-busy", "true");
  }

  try{
    const repliedAt = new Date().toISOString();

    const response = await fetch(
      "/api/leads/" + encodeURIComponent(lead.leadId),
      {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          status: "Contact Request - Replied",
          Request: {
            contactRequestRepliedAt: repliedAt
          }
        })
      }
    );

    const result = await response.json();

    if(!response.ok || !result.ok){
      throw new Error(result.error || "The contact request could not be updated.");
    }

    lead.status = "Contact Request - Replied";
    lead.Request = {
      ...(lead.Request || {}),
      contactRequestRepliedAt: repliedAt
    };

    if(button){
      button.textContent = "Marked Replied";
      button.removeAttribute("aria-busy");
    }

    clearDetailPanel();

    setTimeout(() => {
      renderLeads();
    }, 450);
  }catch(error){
    if(button){
      button.disabled = false;
      button.textContent = originalText;
      button.removeAttribute("aria-busy");
    }

    alert(error && error.message ? error.message : "The contact request could not be updated.");
  }
}
