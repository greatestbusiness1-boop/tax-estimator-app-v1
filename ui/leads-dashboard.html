<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      color: #12233d;
    }

    .sidebar {
      width: 260px;
      min-height: 100vh;
      background: #0f2c56;
      color: white;
      padding: 20px 16px;
      box-sizing: border-box;
    }

    .sidebar h2 {

    }

    .sidebar-btn {
      display: block;
      width: 100%;
      margin: 0 0 10px;
      padding: 11px;
      background: #28588c;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      text-align: left;
      font-weight: 700;
    }

    .sidebar-btn.active {
      background: white;
      color: #0f2c56;
      border-left: 7px solid #f59e0b;
    }

    .sidebar-group {
      margin: 18px 0 8px;
      padding: 0 4px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;

    }

    .sidebar-divider {

      background: rgba(255, 255, 255, 0.16);
    }

    .main {
      flex: 1;
      padding: 24px;
      box-sizing: border-box;
    }

    #leadCount {
      margin-bottom: 18px;
      font-weight: 700;
      color: #52637a;
    }

    .lead-card {
      background: white;
      border: 1px solid #dbe4f0;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .lead-name {
      font-size: 18px;
      font-weight: 900;
      color: #0f2c56;
      margin-bottom: 4px;
    }

    .lead-details {
      font-size: 14px;
      line-height: 1.5;
      color: #475569;
    }

    .empty,
    .error {
      background: white;
      border-radius: 10px;

    }

    }

    }

      background: #28588c;
      color: #ffffff;
      padding: 8px 13px;
      font-weight: 700;
      cursor: pointer;

</head>

<script>
let allLeads = [];
let currentView = "office";
let currentTaxPrepFilter = "all";
let currentContactFilter = "new";

let currentContactMonth = "all";
let currentContactYear = "all";
let currentContactService = "all";
let currentContactStatus = "all";
let currentContactSearch = "";

let currentTaxPrepMonth = "all";
let currentTaxPrepYear = "all";
let currentTaxPrepTaxYear = "all";
let currentTaxPrepLane = "all";
let currentTaxPrepStatus = "all";
let currentTaxPrepSearch = "";

let currentAllMonth = "all";
let currentAllYear = "all";
let currentAllType = "all";
let currentAllStatus = "all";
let currentAllSearch = "";

const closedToday = new Date();
let currentClosedMonth = String(closedToday.getMonth() + 1);
let currentClosedYear = String(closedToday.getFullYear());
let currentClosedService = "all";
let currentClosedSearch = "";

function formatLeadDate(value){
  if(!value) return "";

  const date = new Date(value);

  if(Number.isNaN(date.getTime())){
    return "";
  }

  return date.toLocaleString();
}

function formatDashboardPhone(value){
  const raw = String(value || "").trim();
  const digits = raw.replace(/\D/g, "").slice(0, 10);

  if(digits.length !== 10){
    return raw || "Not provided";
  }

  return `(${digits.slice(0, 3)}) ${digits.slice(3, 6)}-${digits.slice(6)}`;
}

function getLeadEnteredAt(lead){
  return (
    lead.timestamp ||
    lead.createdAt ||
    lead.created_at ||
    ""
  );
}

function isCalendarLead(lead){
  return Boolean(lead?.calendarAppointment);
}

function getCalendarStatus(lead){
  const leadStatus = String(lead?.status || "").trim();

  if(leadStatus.toLowerCase().startsWith("calendar -")){
    return leadStatus.replace(/^calendar\s*-\s*/i, "").trim();
  }

  return String(
    lead?.calendarAppointment?.status ||
    leadStatus ||
    ""
  ).trim();
}

function getCalendarService(lead){
  return String(
    lead?.calendarAppointment?.eventName ||
    "Calendar Appointment"
  ).trim();
}

function getCalendarStart(lead){
  return String(
    lead?.calendarAppointment?.startTime ||
    ""
  ).trim();
}

function isClosedCalendarLead(lead){
  const status = getCalendarStatus(lead).toLowerCase();
  return (
    status.includes("completed") ||
    status.includes("no-show") ||
    status.includes("no show") ||
    status.includes("canceled") ||
    status.includes("cancelled")
  );
}

function formatCalendarLocation(lead){
  const appointment = lead?.calendarAppointment || {};
  const location = appointment.location;
  const meetingType =
    appointment.meetingType ||
    location?.type ||
    "";

  if(!location){
    return meetingType || "Not provided";
  }

  if(typeof location === "string"){
    return location;
  }

  if(meetingType === "Phone Call"){
    return location.display ||
      `Phone Call — ${formatUSPhone(
        location.phone || lead?.contact?.phone || ""
      )}`;
  }

  return (
    location.display ||
    location.join_url ||
    location.address ||
    location.location ||
    meetingType ||
    "Online"
  );
}

function formatUSPhone(value){
  const digits = String(value || "")
    .replace(/\D/g, "")
    .slice(0, 10);

  if(!digits) return "";
  if(digits.length < 4) return `(${digits}`;
  if(digits.length < 7){
    return `(${digits.slice(0,3)}) ${digits.slice(3)}`;
  }

  return `(${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6)}`;
}

function getAllLeadTypeKey(lead){
  const status = String(lead?.status || "").toLowerCase();
  const leadId = String(lead?.leadId || "").toLowerCase();

  if(
    status.includes("written review") ||
    lead?.writtenReviewDeliveredAt ||
    lead?.writtenReviewCompletedAt ||
    lead?.writtenReview
  ){
    return "written-review";
  }

  if(
    isTaxPreparationLead(lead) ||
    status.includes("tax preparation")
  ){
    return "tax-preparation";
  }

  if(
    isWebsiteContactLead(lead) ||
    status.includes("contact request")
  ){
    return "website-contact";
  }

  if(
    leadId.includes("transcript") ||
    status.includes("transcript") ||
    lead?.transcriptRequest
  ){
    return "transcript";
  }

  if(
    lead?.estimateSummary ||
    lead?.taxData ||
    leadId.includes("lead-")
  ){
    return "estimate";
  }

  return "other";
}

function getAllLeadTypeLabel(lead){
  const labels = {
    "written-review": "Written Review",
    "tax-preparation": "Tax Preparation",
    "website-contact": "Website Contact",
    "transcript": "Transcript",
    "estimate": "Free Estimate",
    "other": "Other"
  };

  return labels[getAllLeadTypeKey(lead)] || "Other";
}

function getAllLeadTaxYear(lead){
  return String(
    lead?.taxPreparationIntake?.taxYear ||
    lead?.taxData?.taxYear ||
    lead?.estimateSummary?.taxYear ||
    ""
  ).trim();
}

function getAllLeadLatestAction(lead){
  const status = String(lead?.status || "New").trim();

  if(lead?.writtenReviewDeliveredAt){
    return "Written review delivered";
  }

  if(lead?.writtenReviewCompletedAt){
    return "Written review completed";
  }

  if(lead?.Request?.officeWorkCompletedAt || lead?.completedAt){
    return "Office work completed";
  }

  if(getContactRepliedAt(lead)){
    return "Website contact replied";
  }

  if(status.toLowerCase().includes("ready to schedule")){
    return "Ready to schedule";
  }

  if(status.toLowerCase().includes("needs review")){
    return "Needs review";
  }

  return status || "New";
}

function matchesAllLeadFilters(lead){
  const enteredAt = getLeadEnteredAt(lead);
  const enteredDate = enteredAt ? new Date(enteredAt) : null;
  const validDate =
    enteredDate &&
    !Number.isNaN(enteredDate.getTime());

  if(currentAllYear !== "all"){
    if(
      !validDate ||
      String(enteredDate.getFullYear()) !== currentAllYear
    ){
      return false;
    }
  }

  if(currentAllMonth !== "all"){
    if(
      !validDate ||
      String(enteredDate.getMonth() + 1) !== currentAllMonth
    ){
      return false;

function getClosedServiceKey(lead){
  const status = String(lead?.status || "").toLowerCase();
  const leadId = String(lead?.leadId || "").toLowerCase();

  if(
    status.includes("written review") ||
    lead?.writtenReviewDeliveredAt ||
    lead?.writtenReviewCompletedAt ||
    lead?.writtenReview
  ){
    return "written-review";
  }

  if(
    isTaxPreparationLead(lead) ||
    status.includes("tax preparation")
  ){
    return "tax-preparation";
  }

  if(
    isWebsiteContactLead(lead) ||
    status.includes("contact request")
  ){
    return "website-contact";
  }

  if(
    leadId.includes("transcript") ||
    status.includes("transcript") ||

}

function matchesTaxPrepFilter(lead){
  const status = String(lead?.status || "").toLowerCase();
  const lane = getTaxPrepLane(lead).toLowerCase();
  const isCompleted =
    status.includes("completed") ||
    status.includes("closed");

  if(currentTaxPrepFilter === "new") return status.includes("ready to schedule");
  if(currentTaxPrepFilter === "simple") return !isCompleted && (lane.includes("individual form 1040") || lane.includes("simple individual"));
  if(currentTaxPrepFilter === "gig") return !isCompleted && (lane.includes("gig worker") || lane.includes("self-employed"));
  if(currentTaxPrepFilter === "complex") return !isCompleted && (lane.includes("investment") || lane.includes("complex"));
  if(currentTaxPrepFilter === "business") return !isCompleted && (lane.includes("business") || lane.includes("entity"));
  if(currentTaxPrepFilter === "review") return !isCompleted && (status.includes("needs review") || Boolean(lead?.taxPreparationIntake?.needsProfessionalReview));
  if(currentTaxPrepFilter === "completed") return isCompleted;

  // "All Tax Preparation" is the active worklist.
  return !isCompleted;
}

function getVisibleLeads(){
  if(currentView==="websitecontact"){
    return allLeads
      .filter(isWebsiteContactLead)
      .filter(matchesContactFilter)
      .filter(matchesContactAdvancedFilters)
      .sort((a,b) => new Date(getLeadEnteredAt(b) || 0) - new Date(getLeadEnteredAt(a) || 0));
  }

  if(currentView==="taxprep"){
    return allLeads
      .filter(isTaxPreparationLead)
      .filter(matchesTaxPrepFilter)
      .filter(matchesTaxPrepAdvancedFilters)
      .sort((a,b) => new Date(getLeadEnteredAt(b) || 0) - new Date(getLeadEnteredAt(a) || 0));
  }

  if(currentView==="written"){
    return allLeads.filter(l => {
      const status = String(l.status || "").toLowerCase();

      const isWrittenReview =
        status.includes("written review");

      const isFinished =
        status.includes("closed") ||
        status.includes("completed");

      return isWrittenReview && !isFinished;
    });
  }

  if(currentView==="calendar"){
    return allLeads
      .filter(isCalendarLead)
      .filter(lead => !isClosedCalendarLead(lead))
      .sort((a,b) =>
        new Date(getCalendarStart(a) || 0) -
        new Date(getCalendarStart(b) || 0)
      );
  }

  if(currentView==="calendarclosed"){
    return allLeads
      .filter(isCalendarLead)
      .filter(isClosedCalendarLead)
      .sort((a,b) =>
        new Date(
          b?.calendarAppointment?.completedAt ||
          b?.calendarAppointment?.canceledAt ||
          getCalendarStart(b) ||
          0
        ) -
        new Date(
          a?.calendarAppointment?.completedAt ||
          a?.calendarAppointment?.canceledAt ||
          getCalendarStart(a) ||
          0
        )
      );
  }

  if(currentView==="closed"){
    return allLeads
      .filter(l => {
        const s=(l.status||"").toLowerCase();
        return s.includes("closed")||s.includes("completed");
      })
      .filter(matchesClosedFilters)
      .sort((a,b) =>
        new Date(getLeadClosedAt(b) || 0) -
        new Date(getLeadClosedAt(a) || 0)
      );
  }

  if(currentView==="all"){
    return allLeads
      .filter(matchesAllLeadFilters)
      .sort((a,b) =>
        new Date(getLeadEnteredAt(b) || 0) -
        new Date(getLeadEnteredAt(a) || 0)
      );
  }

  if(currentView==="office"){
    return allLeads.filter(l => {
      const status = String(l.status || "").toLowerCase();

      const isClosed =
        status.includes("closed") ||
        status.includes("completed");

      const requiresAttention =
        status.includes("needs written review") ||
        status.includes("needs review") ||
        status.includes("needs attention") ||
        status.includes("action required") ||
        status.includes("follow-up needed") ||
        status.includes("missing information") ||
        status.includes("report failed") ||
        status.includes("email failed") ||
        status.includes("delivery failed") ||
        status.includes("overdue") ||
        status.includes("error");

      return !isClosed && requiresAttention;
    });
  }

  return allLeads;
}

  count.innerText = visible.length + (visible.length === 1 ? " lead" : " leads");

  if(currentView === "all"){
    updateAllSummary(visible.length);

  if(
    !visible.length &&
    currentView !== "calendar" &&
    currentView !== "calendarclosed"
  ){
    list.innerHTML="<div class='empty'>No leads found</div>";
    return;

function populateManualAppointmentClients(){
  const select = document.getElementById("manualApptClientLookup");
  if(!select) return;

  const unique = new Map();

  (allLeads || []).forEach(lead => {
    const email = String(lead?.contact?.email || "").trim().toLowerCase();
    const name = String(lead?.contact?.name || "").trim();
    if(!email || !name) return;

    if(!unique.has(email)){
      unique.set(email, {
        name,
        email,
        phone: formatUSPhone(lead?.contact?.phone || "")
      });
    }
  });

  window.manualAppointmentClients = Array.from(unique.values())
    .sort((a,b) => a.name.localeCompare(b.name));

  select.innerHTML =
    '<option value="">Clear selection / enter a new client</option>' +
    window.manualAppointmentClients
      .map((client, index) => `
        <option value="${index}">
          ${client.name} — ${client.email}${client.phone ? ` — ${client.phone}` : ""}
        </option>
      `)
      .join("");

  select.value = "";
}

function fillManualAppointmentClient(){
  const select =
    document.getElementById("manualApptClientLookup");

  const selectedValue = String(select?.value || "").trim();

  if(selectedValue === ""){
    document.getElementById("manualApptName").value = "";
    document.getElementById("manualApptEmail").value = "";
    document.getElementById("manualApptPhone").value = "";
    updateManualMeetingDetails();
    return;
  }

  const index = Number(selectedValue);
  const client = (window.manualAppointmentClients || [])[index];

  if(!client) return;

  document.getElementById("manualApptName").value = client.name;
  document.getElementById("manualApptEmail").value = client.email;
  document.getElementById("manualApptPhone").value = client.phone;
  updateManualMeetingDetails();
}

  if(linkInput){
    linkInput.addEventListener("input", validateManualMeetingLink);
    linkInput.addEventListener("blur", validateManualMeetingLink);
  }

function validateManualMeetingLink(){
  const meetingType =
    document.getElementById("manualApptMeetingType")?.value || "";

  const input =
    document.getElementById("manualApptMeetingLink");

  const status =
    document.getElementById("manualApptMeetingLinkStatus");

  const saveButton =
    document.getElementById("manualApptSaveButton");

  if(!input || !status) return true;

  const value = String(input.value || "").trim();

  if(!value){
    status.style.display = "none";
    input.style.borderColor = "#cbd5e1";

    if(saveButton){
      saveButton.disabled = false;
    }

    return false;
  }

  let valid = false;
  let message = "";

  try{
    const url = new URL(value);

    if(meetingType === "Google Meet"){
      valid =
        url.protocol === "https:" &&
        url.hostname.toLowerCase() === "meet.google.com";

      message = valid
        ? "Valid Google Meet link."
        : "Use a real link beginning with https://meet.google.com/.";
    }else{
      valid =
        url.protocol === "http:" ||
        url.protocol === "https:";

      message = valid
        ? "Valid online meeting link."
        : "Enter a complete http:// or https:// link.";
    }
  }catch{
    valid = false;
    message =
      meetingType === "Google Meet"
        ? "Use a real link beginning with https://meet.google.com/."
        : "Enter a complete http:// or https:// link.";
  }

  status.textContent = message;
  status.style.display = "block";
  status.style.color = valid ? "#166534" : "#b91c1c";
  input.style.borderColor = valid ? "#16a34a" : "#dc2626";

  if(saveButton){
    saveButton.disabled = !valid;
  }

  return valid;
}

async function saveManualAppointment(allowConflict){
  const button = document.getElementById("manualApptSaveButton");
  const errorBox = document.getElementById("manualApptError");
  const conflictBox = document.getElementById("manualApptConflict");
  const originalText = button.textContent;

  errorBox.style.display = "none";
  conflictBox.style.display = "none";
  button.disabled = true;
  button.textContent = "Checking Schedule...";

  const startValue =
    document.getElementById("manualApptStart").value;

  const durationMinutes = Number(
    document.getElementById("manualApptDuration").value || 15
  );

  const start = new Date(startValue);
  const end = new Date(start.getTime() + durationMinutes * 60000);
  const meetingType =
    document.getElementById("manualApptMeetingType").value;

  const meetingLink =
    document.getElementById("manualApptMeetingLink")?.value.trim() || "";

  if(
    meetingType === "Google Meet" ||
    meetingType === "Other Online Meeting"
  ){
    const validLink = validateManualMeetingLink();

    if(!validLink){
      errorBox.textContent =
        meetingType === "Google Meet"
          ? "Google Meet requires a real https://meet.google.com/... link."
          : "Enter a valid online meeting link.";
      errorBox.style.display = "block";
      button.disabled = false;
      button.textContent = originalText;
      return;
    }
  }

  const payload = {
    name: document.getElementById("manualApptName").value.trim(),
    email: document.getElementById("manualApptEmail").value.trim(),
    phone: formatUSPhone(
      document.getElementById("manualApptPhone").value
    ),
    service: document.getElementById("manualApptService").value,
    startTime: start.toISOString(),
    endTime: end.toISOString(),
    durationMinutes,
    meetingType,
    meetingLink,
    meetingAddress:
      document.getElementById("manualApptMeetingAddress")?.value.trim() || "",
    notes: document.getElementById("manualApptNotes").value.trim(),
    allowConflict: Boolean(allowConflict)
  };

  try{
    const response = await fetch("/api/calendar-appointment", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    const contentType =
      response.headers.get("content-type") || "";

    if(!contentType.includes("application/json")){
      throw new Error(
        "The appointment server route is not loaded. Restart Node and try again."
      );
    }

    const data = await response.json();

    if(response.status === 409 && data.conflict){
      const details = (data.conflicts || [])
        .map(item =>
          `${item.clientName} — ${new Date(item.startTime).toLocaleString()}`
        )
        .join("<br>");

      conflictBox.innerHTML = `
        <strong>Schedule conflict found.</strong><br>
        ${details || data.message}<br><br>
        <button type="button"
          onclick="saveManualAppointment(true)"
          style="border:0;background:#b45309;color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;">
          Save Anyway
        </button>
      `;
      conflictBox.style.display = "block";
      return;
    }

    if(!response.ok || !data.ok){
      throw new Error(
        Array.isArray(data.errors)
          ? data.errors.join(" ")
          : data.error || "Could not save appointment."
      );
    }

    closeManualAppointmentForm();
    await loadLeads();

    alert(
      `${data.lead?.contact?.name || "Client"} was added to Calendar Scheduled.`
    );
  }catch(error){
    console.error(error);
    errorBox.textContent =
      error.message || "Could not save appointment.";
    errorBox.style.display = "block";
  }finally{
    button.disabled = false;
    button.textContent = originalText;
  }
}

function toggleManualAppointmentDictation(){
  if(window.manualAppointmentRecognition){
    stopManualAppointmentDictation();
    return;
  }

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  const status =
    document.getElementById("manualApptMicStatus");

  if(!SpeechRecognition){
    status.textContent =
      "Dictation is not supported in this browser. Typing remains available.";
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = "en-US";

  const notes = document.getElementById("manualApptNotes");
  const original = notes.value.trim();
  let finalTranscript = "";

  recognition.onstart = () => {
    window.manualAppointmentRecognition = recognition;
    document.getElementById("manualApptMicButton").textContent =
      "■ Stop Dictation";
    status.textContent = "Listening… speak naturally.";
  };

  recognition.onresult = event => {
    let interim = "";

    for(let i = event.resultIndex; i < event.results.length; i++){
      const transcript = event.results[i][0].transcript;

      if(event.results[i].isFinal){
        finalTranscript += transcript.trim() + " ";
      }else{
        interim += transcript;
      }
    }

    notes.value = [
      original,
      finalTranscript.trim(),
      interim.trim()
    ].filter(Boolean).join(original ? " " : "");
  };

  recognition.onerror = event => {
    status.textContent =
      event.error === "not-allowed"
        ? "Microphone permission was denied. Typing remains available."
        : "Dictation stopped. You can continue typing.";
  };

  recognition.onend = () => {
    window.manualAppointmentRecognition = null;
    document.getElementById("manualApptMicButton").textContent =
      "🎙 Start Dictation";
    if(!status.textContent.includes("denied")){
      status.textContent = "Dictation stopped. Edit the notes as needed.";
    }
  };

  recognition.start();
}

function stopManualAppointmentDictation(){
  if(window.manualAppointmentRecognition){
    window.manualAppointmentRecognition.stop();
    window.manualAppointmentRecognition = null;
  }
}

async function markCalendarOutcome(index, outcome, button){
  const lead = (window.visibleCalendarLeads || [])[index];

  if(!lead){
    alert("Calendar appointment could not be identified.");
    return;
  }

  const clientName = String(
    lead?.contact?.name ||
    lead?.calendarAppointment?.inviteeName ||
    "this client"
  ).trim();

  const serviceName = getCalendarService(lead);
  const confirmed = window.confirm(
    `Mark ${clientName}'s ${serviceName} as ${outcome}?`
  );

  if(!confirmed) return;

  const originalText = button?.textContent || "";
  if(button){
    button.disabled = true;
    button.textContent = "Updating...";
  }

  const now = new Date().toISOString();

  try{
    const response = await fetch(
      `/api/leads/${encodeURIComponent(lead.leadId)}`,
      {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          status: `Calendar - ${outcome}`,
          calendarAppointment: {
            status: outcome,
            completedAt: outcome === "Completed" ? now : "",
            noShowAt: outcome === "No-Show" ? now : ""
          },
          completedAt: now,
          closedAt: now
        })
      }
    );

    const data = await response.json();

    if(!response.ok || !data.ok){
      throw new Error(data.error || "Calendar update failed.");
    }

    lead.status = `Calendar - ${outcome}`;
    lead.completedAt = now;
    lead.closedAt = now;
    lead.calendarAppointment = {
      ...(lead.calendarAppointment || {}),
      status: outcome,
      completedAt: outcome === "Completed" ? now : "",
      noShowAt: outcome === "No-Show" ? now : ""
    };

    clearDetailPanel();
    renderLeads();
    await loadLeads();

    alert(
      `${clientName}'s ${serviceName} was marked ${outcome} and moved to Closed Calendar.`
    );
  }catch(error){
    console.error(error);
    alert(error.message || "Could not update the calendar appointment.");

    if(button){
      button.disabled = false;
      button.textContent = originalText;
    }
  }
}

    service.addEventListener("change", () => {
      currentClosedService = service.value || "all";
      clearDetailPanel();
      renderLeads();
    });
  }

  if(search){
    search.addEventListener("input", () => {
      currentClosedSearch = search.value.trim();
      clearDetailPanel();
      renderLeads();
    });
  }
});
</script>

</body>
</html>
