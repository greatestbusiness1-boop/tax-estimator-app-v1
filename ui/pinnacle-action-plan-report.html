<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pinnacle Tax Action Plan</title>
<style>
  :root {
    --ink:#111827;
    --muted:#4b5563;
    --navy:#071d3a;
    --blue:#0f4c81;
    --gold:#f59e0b;
    --red:#b91c1c;
    --orange:#c2410c;
    --green:#047857;
    --paper:#ffffff;
    --soft:#f3f6fb;
    --line:#d7deea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: #dfe7f3;
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
  }
  .toolbar {
    max-width: 900px;
    margin: 0 auto 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .toolbar button {
    border: 0;
    border-radius: 10px;
    padding: 11px 18px;
    cursor: pointer;
    font-weight: 800;
    background: var(--navy);
    color: #fff;
    font-size: 14px;
  }
  .preview-banner {
    max-width: 900px;
    margin: 0 auto 14px;
    background: var(--gold);
    color: #3d2b00;
    font-weight: 800;
    text-align: center;
    padding: 10px 14px;
    border-radius: 10px;
    letter-spacing: .04em;
    text-transform: uppercase;
    font-size: 13px;
  }
  .report {
    max-width: 900px;
    margin: 0 auto;
    background: var(--paper);
    box-shadow: 0 18px 50px rgba(7,29,58,.18);
    border-radius: 18px;
    overflow: hidden;
  }
  .cover {
    background: linear-gradient(135deg, #071d3a 0%, #0f4c81 55%, #0b2d53 100%);
    color: #fff;
    padding: 30px 28px;
  }
  .cover .brand {
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
    opacity: .85;
    margin: 0 0 6px;
  }
  .cover h1 {
    margin: 0 0 14px;
    font-size: 28px;
  }
  .cover-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 10px 24px;
    font-size: 14px;
  }
  .cover-grid span { opacity: .75; display:block; font-size: 12px; }
  .cover-grid strong { font-size: 15px; }
  .status-pill {
    display: inline-block;
    margin-top: 10px;
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,.18);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .section {
    padding: 24px 28px;
    border-bottom: 1px solid var(--line);
  }
  .section:last-child { border-bottom: none; }
  .section h2 {
    margin: 0 0 12px;
    font-size: 18px;
    color: var(--navy);
  }
  .section p { line-height: 1.55; color: var(--ink); margin: 0 0 10px; }
  .tax-snapshot {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 10px;
    margin-top: 12px;
  }
  .tax-snapshot div {
    background: var(--soft);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .tax-snapshot span { display:block; font-size: 11px; color: var(--muted); }
  .tax-snapshot strong { font-size: 16px; color: var(--navy); }
  .priority-group { margin-bottom: 18px; }
  .priority-group:last-child { margin-bottom: 0; }
  .priority-group h3 {
    font-size: 13px;
    letter-spacing: .05em;
    text-transform: uppercase;
    margin: 0 0 10px;
  }
  .priority-group.high h3 { color: var(--red); }
  .priority-group.medium h3 { color: var(--orange); }
  .priority-group.low h3 { color: var(--green); }
  .action-card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    break-inside: avoid;
    page-break-inside: avoid;
  }
  .action-card:last-child { margin-bottom: 0; }
  .action-card h4 { margin: 0 0 6px; font-size: 15px; color: var(--navy); }
  .action-card .meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .action-card .field { font-size: 13px; margin: 4px 0; }
  .action-card .field strong { color: var(--navy); }
  ul.checklist { margin: 0; padding-left: 20px; }
  ul.checklist li { margin-bottom: 6px; line-height: 1.45; }
  .key-dates { list-style: none; margin: 0; padding: 0; }
  .key-dates li {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    padding: 8px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 14px;
  }
  .key-dates li:last-child { border-bottom: none; }
  .disclosure {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }
  .empty-note { color: var(--muted); font-style: italic; }
  .pending-wrap {
    max-width: 640px;
    margin: 60px auto;
    background: var(--paper);
    border-radius: 18px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(7,29,58,.18);
  }
  .pending-wrap h1 { color: var(--navy); font-size: 22px; }
  .pending-wrap p { color: var(--muted); line-height: 1.6; }
  .error-wrap { max-width: 640px; margin: 60px auto; text-align: center; color: var(--muted); }

  @media (max-width: 640px) {
    .cover-grid { grid-template-columns: 1fr; }
    .tax-snapshot { grid-template-columns: 1fr; }
    .section { padding: 18px 16px; }
    .cover { padding: 22px 18px; }
  }

  @media print {
    html, body { background: #fff !important; margin:0 !important; padding:0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .toolbar, .no-print { display: none !important; }
    .preview-banner { display: none !important; }
    .report { box-shadow: none; border-radius: 0; max-width: 100%; }
    /* Only the smallest atomic unit (one recommendation card) is protected
       from splitting mid-card -- a whole section/priority group is allowed
       to break naturally across pages, since forcing a long section to stay
       together would create a large blank gap instead. */
    .action-card { break-inside: avoid; page-break-inside: avoid; }
    h2, h3 { break-after: avoid; page-break-after: avoid; }
    .cover { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
  <div id="app">
    <div class="error-wrap">Loading your Pinnacle Tax Action Plan&hellip;</div>
  </div>

<script>
  function escapeHtml(value){
    return String(value ?? "").replace(/[&<>"']/g, (c) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  function money(value){
    return typeof value === "number"
      ? "$" + Math.round(value).toLocaleString("en-US")
      : "";
  }

  function formatDate(value){
    if(!value) return "";
    const parsed = new Date(value);
    if(Number.isNaN(parsed.getTime())) return String(value);
    return parsed.toLocaleDateString("en-US", { year:"numeric", month:"long", day:"numeric" });
  }

  const isOfficePreview = location.pathname.startsWith("/office/pinnacle-action-plan-report/");
  const officeLeadId = isOfficePreview
    ? decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "")
    : "";

  const endpoint = isOfficePreview
    ? `/api/admin/pinnacle-action-plan-report/${encodeURIComponent(officeLeadId)}`
    : "/api/client-portal/pinnacle/action-plan-report";

  function renderPending(message){
    document.getElementById("app").innerHTML = `
      <div class="pending-wrap">
        <h1>Pinnacle Tax Action Plan</h1>
        <p>${escapeHtml(message || "Your Pinnacle Tax Action Plan is being prepared and reviewed by your tax professional. You will be able to review it here once it is ready.")}</p>
      </div>
    `;
  }

  function renderError(message){
    document.getElementById("app").innerHTML = `
      <div class="error-wrap"><p>${escapeHtml(message)}</p></div>
    `;
  }

  function priorityGroupHtml(label, items){
    if(!items || !items.length) return "";
    const cards = items.map((rec) => `
      <div class="action-card">
        <h4>${escapeHtml(rec.title || "Recommended action")}</h4>
        <div class="meta">${escapeHtml((rec.status || "").replace(/_/g," "))}</div>
        ${rec.recommendation ? `<p class="field">${escapeHtml(rec.recommendation)}</p>` : ""}
        ${rec.rationale ? `<p class="field"><strong>Why:</strong> ${escapeHtml(rec.rationale)}</p>` : ""}
        ${rec.estimatedImpact ? `<p class="field"><strong>Estimated impact:</strong> ${escapeHtml(rec.estimatedImpact)}</p>` : ""}
        ${rec.deadline ? `<p class="field"><strong>Deadline:</strong> ${escapeHtml(formatDate(rec.deadline))}</p>` : ""}
        ${rec.documentsNeeded ? `<p class="field"><strong>Documents needed:</strong> ${escapeHtml(rec.documentsNeeded)}</p>` : ""}
        ${rec.clientAction ? `<p class="field"><strong>What to do:</strong> ${escapeHtml(rec.clientAction)}</p>` : ""}
      </div>
    `).join("");

    return `
      <div class="priority-group ${label.toLowerCase()}">
        <h3>${escapeHtml(label)} Priority</h3>
        ${cards}
      </div>
    `;
  }

  function renderReport(report){
    const identity = report.identity || {};
    const currentTaxPosition = report.currentTaxPosition || {};
    const snapshot = currentTaxPosition.snapshot;
    const priority = report.priorityActionPlan || { high:[], medium:[], low:[] };
    const hasAnyAction = (priority.high?.length || 0) + (priority.medium?.length || 0) + (priority.low?.length || 0) > 0;
    const keyDates = Array.isArray(report.keyDates) ? report.keyDates : [];
    const documentChecklist = Array.isArray(report.documentChecklist) ? report.documentChecklist : [];
    const clientActionChecklist = Array.isArray(report.clientActionChecklist) ? report.clientActionChecklist : [];

    const statusLabel = identity.status === "delivered" ? "Delivered" : "Approved";

    document.getElementById("app").innerHTML = `
      <div class="toolbar no-print">
        <span></span>
        <button onclick="window.print()">Print / Save as PDF</button>
      </div>
      ${report.preview ? `<div class="preview-banner">Office Preview -- this is exactly what the client will see</div>` : ""}
      <div class="report">
        <div class="cover">
          <p class="brand">Pinnacle Tax Action Plan</p>
          <h1>${escapeHtml(identity.clientName || "Client")}</h1>
          <div class="cover-grid">
            ${identity.businessName ? `<div><span>Business</span><strong>${escapeHtml(identity.businessName)}</strong></div>` : ""}
            ${identity.taxYear ? `<div><span>Tax Year</span><strong>${escapeHtml(identity.taxYear)}</strong></div>` : ""}
            ${identity.preparedDate ? `<div><span>Prepared / Reviewed</span><strong>${escapeHtml(formatDate(identity.preparedDate))}</strong></div>` : ""}
            ${identity.deliveredAt ? `<div><span>Delivered</span><strong>${escapeHtml(formatDate(identity.deliveredAt))}</strong></div>` : ""}
          </div>
          <span class="status-pill">${escapeHtml(statusLabel)}</span>
        </div>

        ${report.executiveSummary ? `
          <div class="section">
            <h2>Executive Summary</h2>
            <p>${escapeHtml(report.executiveSummary)}</p>
          </div>
        ` : ""}

        ${(currentTaxPosition.narrative || snapshot) ? `
          <div class="section">
            <h2>Current Tax Position</h2>
            ${currentTaxPosition.narrative ? `<p>${escapeHtml(currentTaxPosition.narrative)}</p>` : ""}
            ${snapshot ? `
              <div class="tax-snapshot">
                <div><span>Estimated Total Tax</span><strong>${money(snapshot.estimatedTotalTax)}</strong></div>
                <div><span>Tax Payments Recorded</span><strong>${money(snapshot.taxPaymentsRecorded)}</strong></div>
                <div><span>Remaining Estimated Tax</span><strong>${money(snapshot.remainingEstimatedTax)}</strong></div>
              </div>
            ` : ""}
          </div>
        ` : ""}

        <div class="section">
          <h2>Priority Action Plan</h2>
          ${hasAnyAction ? `
            ${priorityGroupHtml("High", priority.high)}
            ${priorityGroupHtml("Medium", priority.medium)}
            ${priorityGroupHtml("Low", priority.low)}
          ` : `<p class="empty-note">No recommended actions have been approved at this time.</p>`}
        </div>

        ${keyDates.length ? `
          <div class="section">
            <h2>Key Dates</h2>
            <ul class="key-dates">
              ${keyDates.map((item) => `<li><span>${escapeHtml(item.title || "Action")}</span><strong>${escapeHtml(formatDate(item.deadline))}</strong></li>`).join("")}
            </ul>
          </div>
        ` : ""}

        ${documentChecklist.length ? `
          <div class="section">
            <h2>Document Checklist</h2>
            <ul class="checklist">${documentChecklist.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
          </div>
        ` : ""}

        ${clientActionChecklist.length ? `
          <div class="section">
            <h2>Client Action Checklist</h2>
            <ul class="checklist">${clientActionChecklist.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
          </div>
        ` : ""}

        ${report.assumptions ? `
          <div class="section">
            <h2>Assumptions / Important Notes</h2>
            <p>${escapeHtml(report.assumptions)}</p>
          </div>
        ` : ""}

        <div class="section">
          <h2>Professional Disclosure</h2>
          <p class="disclosure">${escapeHtml(report.disclosure || "")}</p>
        </div>
      </div>
    `;
  }

  async function load(){
    try{
      const res = await fetch(endpoint, { credentials: "same-origin" });

      if(res.status === 401){
        if(!isOfficePreview){
          window.location.href = "/client-portal";
          return;
        }
        renderError("Your office session has expired. Sign in again to preview this report.");
        return;
      }

      const body = await res.json();

      if(!res.ok || !body.ok){
        renderError(body.error || "This Pinnacle Tax Action Plan could not be loaded.");
        return;
      }

      const report = body.report || {};

      if(!report.available){
        renderPending(report.message);
        return;
      }

      renderReport(report);
    }catch(error){
      renderError("This Pinnacle Tax Action Plan could not be loaded. Please try again.");
    }
  }

  load();
</script>
</body>
</html>
