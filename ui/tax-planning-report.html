<body>
  <div class="screen-toolbar">
    <strong>Executive Tax Planning Report</strong>
    <div class="screen-actions">
      <a id="returnToPlanner" href="/tax-savings-planner.html">Return to Planner</a>
      <button class="primary" type="button" id="printReport">Print / Save PDF</button>
    </div>
  </div>
  <main id="reportRoot" class="report-shell">
    <section class="report-section">
      <div class="empty">Loading the Executive Tax Planning Report...</div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const leadId = params.get("leadId") || "general";
    const snapshotKey = `taxSavingsPlannerExecutiveReport:${leadId}`;
    const snapshot = readSnapshot();

    function readSnapshot() {
      try {
        return JSON.parse(window.localStorage.getItem(snapshotKey) || "null");
      } catch (error) {
        return null;
      }
    }

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    const usd = new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: "USD",
      maximumFractionDigits: 0
    });

    function money(value) {
      const amount = Number(value || 0);
      return usd.format(Number.isFinite(amount) ? Math.round(amount) : 0);
    }

    function emphasizeAmounts(value) {
      return esc(value || "")
        .replace(/(\$[0-9][0-9,]*(?:\.[0-9]{2})?)/g, '<strong class="inline-amount">$1</strong>')
        .replace(/(\b[0-9]+(?:\.[0-9]+)?%)/g, '<strong class="inline-rate">$1</strong>');
    }

    function dateLabel(value) {
      if (!value) return "Not recorded";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
    }

    function statusBadge(label, tone = "potential") {
      return `<span class="badge ${esc(tone)}">${esc(label || "Not Started")}</span>`;
    }

    function priorityTone(priority) {
      if (priority === "urgent" || priority === "high") return priority;
      return "potential";
    }

    function reportFooter(client, label) {
      return `<div class="report-footer"><span>${esc(client.company || "Greatest Business Solution LLC")} | ${esc(client.name || "Client")} | Tax Year ${esc(client.taxYear || "-")}</span><span>${esc(label)}</span></div>`;
    }

    function renderMetric(label, value, tone = "") {
      return `<div class="metric"><span>${esc(label)}</span><strong class="${esc(tone)}">${esc(value)}</strong></div>`;
    }

    function renderAction(item, index = null) {
      const tone = item.stageTone || item.priority || "potential";
      const titlePrefix = index ? `${index}. ` : "";
      const potential = Number(item.estimatedBenefit || 0);
      const verified = Number(item.verifiedBenefit || 0);
      return `
        <article class="action ${esc(tone)}">
          <div class="action-head">
            <h4>${esc(titlePrefix + (item.title || "Planning action"))}</h4>
            ${statusBadge(item.stageLabel || item.statusLabel || item.priority || "Review", tone)}
          </div>
          <p>${esc(item.detail || item.stageSummary || "")}</p>
          <div class="value-row">
            ${potential > 0 ? `<span class="value-pill">Potential benefit <strong>${money(potential)}</strong></span>` : ""}

    function profileItems(profile) {
      const items = [];
      const addMoney = (label, value) => { if (Number(value || 0) > 0) items.push([label, money(value)]); };
      const addText = (label, value, skip = ["", "unknown", "not-applicable"]) => { if (value != null && !skip.includes(String(value))) items.push([label, String(value).replaceAll("-", " ")]); };
      addMoney("Cash charitable contributions", profile.charitableCash);
      addMoney("Noncash charitable contributions", profile.charitableNoncash);
      addText("Charitable documentation", profile.charitableDocs);
      addMoney("Short-term capital gains", profile.shortTermGains);
      addMoney("Long-term capital gains", profile.longTermGains);
      addMoney("Capital losses", profile.capitalLosses);
      addMoney("Dividends and distributions", profile.dividendsDistributions);
      addText("Investment documentation", profile.investmentDocs);
      addMoney("1099-R retirement distributions", profile.retirementDistributions);
      addMoney("Retirement federal withholding", profile.retirementWithholding);
      addMoney("Social Security benefits", profile.socialSecurityBenefits);
      addText("Retirement / Social Security documentation", profile.retirementDocs);
      addMoney("Federal estimated-tax payments", profile.federalEstimatedPayments);
      addMoney("State estimated-tax payments", profile.stateEstimatedPayments);
      if (profile.hasInstallmentAgreement) items.push(["IRS installment agreement", "Client reported an active agreement"]);
      addText("Installment agreement status", profile.installmentStatus);
      if (profile.hasBusinessActivity) items.push(["Business or self-employment activity", "Yes"]);
      addMoney("Estimated net business profit", profile.businessNetProfit);
      addText("Business type / tax structure", profile.businessEntityType);
      addText("Business books", profile.businessBooksStatus);
      addText("Employees / owner payroll", profile.businessPayrollStatus);
      addText("Business and personal funds", profile.businessAccountStatus);
      addMoney("Quarterly Planner business income", profile.quarterlyBusinessIncome);
      addMoney("Quarterly Planner business expenses", profile.quarterlyBusinessExpenses);
      return items;
    }

        <h3>Your Next 3 Moves</h3><div class="action-list">${(roadmap.nextMoves||[]).length ? roadmap.nextMoves.map(move=>renderAction({...move,stageLabel:move.statusLabel,stageTone:move.priority},move.order)).join("") : '<div class="empty">Complete the Planner to create the next three moves.</div>'}</div>
        <h3 style="margin-top:24px">Your 4-Phase Tax-to-Wealth Path</h3>${(roadmap.phases||[]).map(phase=>`<article class="phase ${esc(phase.statusTone||"")}"><div class="phase-number">${Number(phase.order||0)}</div><div><div class="action-head"><h4>${esc(phase.label)}</h4>${statusBadge(phase.statusLabel||"Upcoming",phase.statusTone||"potential")}</div><p><strong>${esc(phase.timeline||"")}</strong> - ${esc(phase.purpose||"")}</p><div class="progress-wrap"><div class="progress-head"><span>Foundation strength</span><strong>${Number(phase.progress||0)}%</strong></div><div class="progress-track"><div class="progress-fill" style="width:${Math.max(0,Math.min(100,Number(phase.progress||0)))}%"></div></div></div></div></article>`).join("")}
        ${roadmap.businessTrack?.active ? `<div class="card gold" style="margin-top:20px"><h3>${esc(roadmap.businessTrack.title)}</h3><p>${esc(roadmap.businessTrack.summary||"")}</p><div class="two-col" style="margin-top:13px">${(roadmap.businessTrack.steps||[]).map(step=>`<div class="card"><h4>${esc(step.title)}</h4><p>${esc(step.detail)}</p><div style="margin-top:8px">${statusBadge(step.label,step.tone)}</div></div>`).join("")}</div></div>` : ""}
        ${reportFooter(client,"Wealth Roadmap")}
      </section>`);

      const boundary = data.serviceBoundaries || {};
      report.push(`<section class="report-section page-break">
        <span class="section-kicker">Your Next Step</span><h2 class="section-title">Continue the Progress Without Confusing Access With Professional Time</h2><p class="section-intro">The initial Planner and this Executive Report provide a strong planning snapshot. Continued software access and live professional services are separate so the client understands exactly what is included.</p><div class="section-rule"></div>
        <div class="service-box"><h3>Tax Planning Service Options</h3><div class="service-grid"><div class="service-item"><strong>Included With the Paid Review</strong><span>${esc(boundary.included||"Initial Tax Savings Planner assessment and one Executive Tax Planning Report")}</span><span class="service-price">Included bonus</span></div><div class="service-item featured"><strong class="service-offer-title">${esc(boundary.continuedAccess?.label||"Continued Tax Planning Access")}</strong><span>${esc(boundary.continuedAccess?.includes||"")}</span><span>${esc(boundary.continuedAccess?.excludes||"")}</span><span class="service-price">${esc(boundary.continuedAccess?.price||"$59 per year")}</span><span class="service-status">${esc(boundary.continuedAccess?.status||"Planned offering")}</span></div><div class="service-item featured"><strong class="service-offer-title">${esc(boundary.reviewMeeting?.label||"Tax Planning Review Meeting")}</strong><span>Live professional review of the Tax Health Score, urgent findings, supporting information, potential opportunities, and recommended actions.</span><span class="service-price">${esc(boundary.reviewMeeting?.duration||"45 minutes")} / ${esc(boundary.reviewMeeting?.price||"$99")}</span><span class="service-billing">Scheduled and billed separately</span></div></div></div>
        <div class="two-col" style="margin-top:20px"><div class="card gold"><h3>What Continued Access Does Not Include</h3><p>Unlimited phone calls, unlimited tax questions, document review, tax-return preparation, IRS representation, or recurring meetings are not included with low-cost portal access. Professional review with Greatest Business Solution LLC is scheduled and billed separately.</p></div><div class="card green"><h3>Recommended Client Next Step</h3><p>${esc(result.primaryRecommendation?.clientAction || roadmap.nextMoves?.[0]?.clientAction || "Review this report, provide the requested information, and schedule a Tax Planning Review with Greatest Business Solution LLC when professional analysis is needed.")}</p></div></div>
        <div class="disclaimer"><strong>Important planning limitation.</strong> This report is an educational planning estimate based on the information currently entered. It is not a filed tax return, legal opinion, investment advice, IRS representation, or a guarantee of tax savings. Potential benefits are preliminary until eligibility, documentation, limits, phase-outs, timing, and tax treatment are professionally reviewed. Tax law and client facts can change. Final decisions should be based on verified information and the client’s complete tax situation.</div>
        ${reportFooter(client,"Next Steps & Service Boundaries")}
      </section>`);

      return report.join("");
    }

    const root = document.getElementById("reportRoot");
    const returnLink = document.getElementById("returnToPlanner");
    const plannerUrl = new URL("/tax-savings-planner.html", window.location.origin);
    if (leadId !== "general") plannerUrl.searchParams.set("leadId", leadId);
    if (params.get("taxYear")) plannerUrl.searchParams.set("taxYear", params.get("taxYear"));
    returnLink.href = plannerUrl.toString();

    if (!snapshot) {
      root.innerHTML = `<section class="report-section"><div class="empty"><h2>Executive Report Snapshot Not Found</h2><p>Return to the Tax Savings Planner, open <strong>10 Executive Report</strong>, and select <strong>Open Executive Tax Planning Report</strong>.</p></div></section>`;
    } else {
      root.innerHTML = renderReport(snapshot);
      document.title = `${snapshot.client?.name || "Client"} - Executive Tax Planning Report`;
    }

    document.getElementById("printReport").addEventListener("click", () => window.print());
  </script>
</body>
</html>
